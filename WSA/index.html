\u201d Ku Klux Klan in 1915. He previously served as a Methodist minister before turning to fraternal organizing and Klan-building, and he headquartered the new Klan in Georgia while drawing heavily on Southern Lost Cause and Protestant rhetoric.</p><p class=\"body-text author-voice\">Roy Elonza Davis, an American preacher and white supremacist who co\u2011founded the second iteration of the Ku Klux Klan in 1915, served as second in command under Simmons and later as Imperial Wizard; he traveled as an evangelist and pastor, founding churches in Texas, Arkansas, Tennessee, Indiana, and Kentucky, and used revivals and religious meetings as tools for Klan recruitment.</p><p class=\"body-text author-voice\">The clergy also used churches as Klan platforms.</p><p class=\"body-text author-voice\">Roy Elonza Davis at First Baptist Church, Wichita Falls, Texas served as pastor there in the early 1920s, published a church paper called \u201cThe Progress\u201d pushing anti\u2011Catholic and Klan themes, and secretly acted as an official Klan spokesperson and organizer, holding Klan meetings at the church until congregants uncovered his record and removed him as pastor.</p><p class=\"body-text author-voice\">Davis\u2019s later churches in Texas, Arkansas, and Tennessee were all used for revival meetings in the 1930s that doubled as Klan recruiting events, while he held high national Klan office.</p><p class=\"body-text author-voice\">American Christians didn\u2019t just cheer the Klan from the pews\u2014they WERE the Klan!</p><div class=\"section-rule\"><div class=\"section-rule-line\"></div><span class=\"section-rule-glyph\">\ud802\udd09\ud802\udd04\ud802\udd05\ud802\udd04</span><div class=\"section-rule-line rev\"></div></div><div class=\"verdict-bar\"><p>William Joseph Simmons \u2014 founder of the revived 1915 Klan \u2014 was a Methodist minister. Roy Elonza Davis \u2014 co-founder \u2014 was a Baptist pastor who used revival meetings as Klan recruitment events. The Klan&#x27;s cross-burning ritual is a Christian ritual. The Klan&#x27;s explicit framing was Protestant Christian nationalist. This is documented. There is no version of American Christian history that honestly excludes it.</p></div>","sectionClass":"author"},{"id":"id_fraud","chNum":"ID","title":"Mistaken Identity & I.D. Fraud","subtitle":"Somebody painted a face and called it Messiah","tag":"L.A. Bond","html":"<p class=\"body-text author-voice\">Are you studying? People perish for lack of what, beloved? It doesn\u2019t say that if they don\u2019t know it\u2019s cool, they\u2019ll be less accountable. No, that\u2019s not what the Word said. Sadly today many of you are deeply involved with a case of either mistaken identity or I.D. Fraud. Somebody painted a face and called it Messiah and many believed it. You didn\u2019t even check the credentials, you just looked at the fake ID &amp; went with its description. Why not do a background check, investigate that which could cost you your soul? People spend more time checking the background of a person than they do one shown to us as the Messiah. You can\u2019t find ONE VERSE in the Hebrew Bible to back such claims, not a single one. Stop giving me New Testament verses to back NewTestament verses, it\u2019s like trying to prove a fake ID with another fake ID. If God is the God of Abraham then why didn\u2019t Abraham do what folks are doing now? What about Jeremiah or Elijah, Daniel or David? The evidence is all before you yet you continue to follow the snake. Yah told Adam &amp; Eve what not to do, are you making the same mistake? So we know the names of Angels. We even know the names of anointed men, like Noah but you mean to tell me that a righteous GOD would forget to tell us about someone else that was equal to Him, in which we\u2019d have to bow to &amp; serve in order to be saved. Even though He warns us never to bow to images or that He doesn\u2019t share His glory with any other? Read the requirements of a sacrifice, now tell me, does this line up with what folks are claiming to be the sacrifice for mankind now? Did the God that does not change, CHANGE? Or have folks decided to worship something other than our Creator &amp; try to attach His name to it as something acceptable?</p><div class=\"section-rule\"><div class=\"section-rule-line\"></div><span class=\"section-rule-glyph\">\ud802\udd09\ud802\udd04\ud802\udd05\ud802\udd04</span><div class=\"section-rule-line rev\"></div></div><div class=\"attorney-block\"><p class=\"attorney-text\">The author issues a forensic challenge: <span class=\"atty-cite\">Genesis 12:3</span> \u2014 YHWH blessed those who bless Avraham. <span class=\"atty-cite\">Deuteronomy 6:4</span> \u2014 Shema Yisrael, YHWH our Creator, YHWH is One. <span class=\"atty-cite\">Isaiah 43:11</span> \u2014 I, I am YHWH, and besides Me there is no Savior. <span class=\"atty-cite\">Isaiah 44:6</span> \u2014 I am the first and I am the last; besides Me there is no god. Now produce a single verse from the Hebrew Bible \u2014 Torah, Nevi&apos;im, Ketuvim \u2014 that instructs the covenant community to worship a co-equal divine son, pray in that son&apos;s name, or credit that son with salvation. The verse does not exist. The burden of proof belongs to those making the claim. Produce the primary source documentation \u2014 not NT verses used to prove NT verses. The record speaks for itself.</p></div>","sectionClass":"author"},{"id":"woe","chNum":"WOE","title":"WOE! WOE! WOE!","subtitle":"A warning. Fast, study, rebuke, pray.","tag":"L.A. Bond","html":"<p class=\"body-text author-voice\">We were given the Commandments yet not one of them warns us to worship a sacrifice. The Hebrew people knew better because they know how long they suffered for disobeying our Creator so this is why most don\u2019t mess around with calling upon other names or Sun-day worship. They follow Moses yet all of these other nations have come along &amp; think that they have the answers even though Yah never gave them the tablets. They\u2019ve transcribed lies to fit their agenda just as warned in Jeremiah 8:8. The contradictions between the Hebrew Bible/Tanakh &amp; what we\u2019ve been taught in the Bible, are numerous.</p><p class=\"body-text author-voice\">What lies have our fathers inherited?</p><p class=\"body-text author-voice\">Folks have added to the text. They\u2019ve told you the word Trinity is in the Word, it is NOT. Folks have assumed a whole lot for something so incredibly important. Then they get mad when you tell them to go to our Creator for truth. What doesn\u2019t Satan want you to know? Why are people painting Easter eggs &amp; teaching that to their children as a form of something holy? Can you go into a church that does not have either an image of a man or an image of a cross in it or upon it? Oh but what were we told concerning these things? Do we ignore what Adonai said simply because most of the world is saying something different? If Christianity truly honors The God of Israel then why is it riddled with paganism? Even Satan has a cross, the klan have a cross, Hitler had a cross, in fact he killed Jews because he said he was a Christian. I\u2019m just asking you to get on your face before your Creator &amp; seek Him. Is this the faith of Abraham or have we learned detestable ways?</p><p class=\"body-text author-voice\">WOE! WOE! WOE! Pray ATTENTION! Fast, study, rebuke, pray &amp; then do ALL OVER AGAIN if you have to, but please dear brethren do not ignore. Something is about to SHAKE!</p><p class=\"body-text author-voice\">If you think it\u2019s evil to serve God then baby tell me just who have you been serving? Why would it be deemed evil to praise your God? IF HE\u2019S really your God! You better check your religion if your religion is turning you away from God to anything else?</p><p class=\"body-text author-voice\">Redeemer, GOD the redeemer in the end will stand upon the earth but whose name will you be calling on as your rock and your redeemer? You sure haven\u2019t been calling on El Shaddai, YHWH, Elohim, The God of Israel, you haven\u2019t called on THE MOST HIGH\u2019s name. You\u2019ve been calling somebody else your Rock &amp; your redeemer trying to pass it off as God\u2019s praise, when He already told you that He ALONE is God &amp; He doesn\u2019t share His glory with nobody else!</p><p class=\"body-text author-voice\">This \ud83d\udc47is what God\u2019s servants do, yet are you doing it in His name or in the name of another? Somebody better listen because the days ahead are about to shake this world! YOU need to know what GOD literally said in His Word, so you know what you\u2019re doing &amp; why you are doing it! Are you going to church because mama did, on Sunday? Are you celebrating Christmas because mama did in December as Christ\u2019s birthday? Read how God feels about the traditions of men! How do you not know that God has chosen you for such a time as this to break generational curses &amp; uncover the lies</p><p class=\"body-text author-voice\">You\u2019re doing what your father did, &amp; not following God\u2019s WORD! Daddy may not have known any better but you DO! You have the luxury of technology. Woe unto you when you won\u2019t even look &amp; seek how to serve YOUR CREATOR! What would make a man fear learning how to please the one he calls LORD? SATAN covers the ears &amp; closes the eyes! The God of Israel OPENS the ears &amp; OPENS the eyes! Tell me, who have you been serving, what name have you called on other than EL Shaddai, Elohim, YHWH, THE MOST HIGH, The God of Israel? To praise another name is not the same as praising HIS name! Read the Word, His Word &amp; understand that GOD does not change, people do.</p><p class=\"body-text author-voice\">Why would a merciful God, a just God decide to send a son that He speaks nothing of. No mention of him in even the Ten Commandments, which we are to follow throughout the generations. Not one word of a Yeshua, a Jesus, a Christ, as His son. I heard of an Immanuel, but history tells that that brother wasn\u2019t born of a Virgin &amp; he was born during the time of Isaiah, but you don\u2019t know because you don\u2019t study, you\u2019re too busy following men.</p><p class=\"body-text author-voice\">Wouldn\u2019t it be important to mention a son in which we must bow to &amp; worship, if our souls are suppose to rely on such a one? In fact we are told that we can\u2019t even get to the Father accept we go by the son, which means we\u2019d have to go to Christ first, yet we are told not to have any other gods before THE Most High. If we say well Jesus is not a god, then why call him Lord &amp; Savior? Especially when The God of Israel already told us that He alone is Lord and that besides Him there is no other Savior.</p><p class=\"body-text author-voice\">Oh folks will tell you of New Testament scriptures to justify New Testament scriptures without clarity of the Old, or even the Hebrew texts. When referring to the Old Testament they lean onto their own understanding by applying taught lies, contradictions &amp; speculation. They speculate that when God said let us, that He was referring to Christ. Now nowhere is that said, yet it\u2019s firmly believed in spite of the fact that God Himself states in several scriptures that He alone created the earth, that He alone, understand what alone means, He alone forgives sins, is our Savior. Who do most call Lord &amp; Savior? Is it Adonai, El Shaddai, Elohim or any of the names of God? No! They call Jesus their Lord &amp; Savior, their rock &amp; redeemer. Ignoring all scriptures that said otherwise.</p><p class=\"body-text author-voice\">Wait, WHO is this \u201cI\u201d, the scripture is talking about? Is it not The God of Israel &amp; what time period was this because if it\u2019s the Old Testament then God was forgiving sins before anyone had to die for sins to be forgiven. Who forgave Nineveh? Who forgave David? Who is this talked about in Psalms 62:6-7, Deut 6:4-6 &amp; Job 19:25? Adonai, that\u2019s WHO, EL Shaddai, ELOHIM, YHWH, The Almighty God of Israel!</p><p class=\"body-text author-voice\">Then ask yourself, if we needed Christ to talk to God, Who did Abraham go through to talk to God? What name did Moses call on to get to God?</p><p class=\"body-text author-voice\">This page is not for the faint of heart nor the fake of heart, I answer to the Almighty God of Israel, HIM ONLY WILL I SERVE! I don\u2019t need your likes, I\u2019m just asking, pleading for you to go to God &amp; ask for TRUTH! I\u2019m not going to itch your ears, your soul means too much for nonsense &amp; lies! Every preacher that opens their doors on Sun-day, WOE! Every church that puts up a Christmas tree, WOE! If they\u2019ve been lying to you about that, what other lies are hiding the spirit of idolatry? Idolatry is NO small thing to God. If you worship &amp; bow to anything other than The God of Israel, you are in DANGER OF IDOLATRY! GO Do your research, GO STUDY, GO FAST, GO PRAY!</p><div class=\"evidence-block\" data-source=\"Dead Sea Scrolls \u2014 Primary Authority\">\n<div class=\"evidence-inner\">\n<div class=\"evidence-ref\">Ezekiel 20:12\u201320 (4QEzek, DSS witness) \u00b7 Qumran Fragment</div>\n<p class=\"evidence-text\">&ldquo;I gave them My Sabbaths to be a sign between Me and them, that they might know that I am YHWH who sets them apart... but they greatly profaned My Sabbaths.&rdquo;</p>\n<p class=\"evidence-note\">The prophetic warning preserved in DSS fragments of Ezekiel mirrors the author&#x27;s WOE declarations precisely: the covenant community that breaks the Sabbath faces the same judgment as those who worshipped other gods. YHWH&#x27;s Sabbath is a sign of covenant identity. Its replacement with Roman Sunday worship is \u2014 by the plain text of this passage \u2014 the same category of violation that brought Israel into captivity.</p>\n</div></div><div class=\"attorney-block\"><p class=\"attorney-text\">The author's WOE declarations align with documented prophetic precedent. <span class=\"atty-cite\">Nehemiah 13:17\u201318</span> \u2014 Yehemiah rebuked the rulers for Sabbath violation and said: 'Did not your fathers do thus, and did not our God bring all this disaster on us and on this city?' <span class=\"atty-cite\">Ezekiel 20:12\u201320 (4QEzek)</span> \u2014 Sabbath as covenant sign; profanation as the mechanism of judgment. The WOE is not hyperbole. It is covenant language with documented historical consequence. The author is issuing the same warning the prophets issued. The record of those warnings being ignored \u2014 and the consequences that followed \u2014 is the entire Old Testament.</p></div>","sectionClass":"author"}];

// ── GE chapter index (built after ge_data.js loads) ───────────────
var GE_CHAPTERS = [];
function buildGeIndex(){
  if(!window.GE_DATA) return;
  GE_DATA.forEach(function(vol){
    vol.chapters.forEach(function(ch){
      GE_CHAPTERS.push({id:'ge_'+vol.vol+'_'+ch.id,vol:vol.vol,volName:vol.name,
        volDesc:vol.desc,chNum:ch.num,title:ch.title,content:ch.content,isGE:true});
    });
  });
}

// ── State ─────────────────────────────────────────────────────────
var cur = 0;
var ALL_CHAPTERS = [];
var sbOpen = false;
var vpOpen = false;
var fs = parseInt(localStorage.getItem('wsa_fs'))||17;

function buildChapterList(){
  ALL_CHAPTERS = WSA_CHAPTERS.slice();
  GE_CHAPTERS.forEach(function(c){ ALL_CHAPTERS.push(c); });
}

// ── Render WSA chapter ────────────────────────────────────────────
function renderWSA(ch){
  var secClass = ch.sectionClass||'author';
  return '<div class="ch-opener '+secClass+'">'
    +'<div class="ch-num">'+escH(ch.chNum)+'</div>'
    +(ch.tag?'<div class="ch-tag">'+escH(ch.tag)+'</div>':'')
    +'<h1 class="ch-title">'+escH(ch.title)+'</h1>'
    +'<p class="ch-subtitle">'+escH(ch.subtitle)+'</p>'
    +'</div>'
    +'<div class="page-body">'+ch.html+'</div>';
}

// ── Render GE chapter ─────────────────────────────────────────────
function renderGEItem(item){
  if(!item||!item.type) return '';
  var t = item.type;
  if(t==='body') return '<p class="body-text">'+escH(item.text||'')+'</p>';
  if(t==='bullet') return '<div class="ge-bullet">'+escH(item.text||'')+'</div>';
  if(t==='fact') return '<div class="ge-fact">'+escH(item.text||'')+'</div>';
  if(t==='part_banner') return '<div class="ge-part">'+escH(item.text||'')+'</div>';
  if(t==='source') return '<div class="ge-source">'+escH(item.text||'')+'</div>';
  if(t==='section'){
    var ps = (item.paragraphs||[]).map(function(p){return '<p class="body-text">'+escH(p)+'</p>';}).join('');
    return '<div class="ge-section">'+escH(item.heading||'')+'</div>'+ps;
  }
  if(t==='note'){
    var nt = item.note_type||'default';
    var cls = nt==='dss'?'ge-note-dss':nt==='orit'?'ge-note-orit':nt==='critical'?'ge-note-critical':'ge-note-default';
    return '<div class="'+cls+'"><span class="note-label">'+escH(item.label||'')+'</span>'
      +'<p class="body-text" style="margin:0;font-size:.9em">'+escH(item.text||'')+'</p></div>';
  }
  return '';
}

function renderGE(ch){
  // Find vol data for header
  var volData = null;
  if(window.GE_DATA) GE_DATA.forEach(function(v){ if(v.vol===ch.vol) volData=v; });
  var hdr = '';
  if(volData && ch.chNum===0){
    hdr = '<div class="ge-vol-header">'
      +'<div class="ge-vol-num">Volume '+volData.vol+'</div>'
      +'<div class="ge-vol-title">THE GREAT ERASER</div>'
      +'<div class="ge-vol-desc">'+escH(volData.desc)+'</div>'
      +'</div>';
  }
  var opener = '<div class="ch-opener special">'
    +'<div class="ch-num">GE &middot; Vol '+ch.vol+' &middot; Ch '+ch.chNum+'</div>'
    +'<div class="ch-tag">The Great Eraser &mdash; '+escH((volData&&volData.name)||'')+'</div>'
    +'<h1 class="ch-title">'+escH(ch.title)+'</h1>'
    +'<p class="ch-subtitle">'+escH((volData&&volData.desc)||'')+'</p>'
    +'</div>';
  var body = '<div class="page-body">'
    +(ch.content||[]).map(renderGEItem).join('')
    +'</div>';
  return hdr+opener+body;
}

// ── Go to chapter ─────────────────────────────────────────────────
function go(idx){
  if(idx<0||idx>=ALL_CHAPTERS.length) return;
  cur = idx;
  var ch = ALL_CHAPTERS[cur];
  var html = ch.isGE ? renderGE(ch) : renderWSA(ch);
  document.getElementById('content').innerHTML = html;
  document.getElementById('main').scrollTop = 0;
  updateSidebar();
  updateNav();
  updateTitle();
  stopVoice();
  clearSearch();
  savePos();
}

// ── Sidebar ───────────────────────────────────────────────────────
function buildSidebar(){
  var wsaEl = document.getElementById('sb-wsa');
  var geEl = document.getElementById('sb-ge');
  wsaEl.innerHTML = '';
  geEl.innerHTML = '';
  
  // WSA section labels
  var sections = {author:'Author Voice',historical:'Historical Record',special:'Key Chapters'};
  var lastSec = null;
  
  WSA_CHAPTERS.forEach(function(ch,i){
    var sec = ch.sectionClass;
    if(sec!==lastSec){
      var lbl = document.createElement('div');
      lbl.className = 'sb-section';
      lbl.style.cssText = 'font-size:8px;padding:8px 14px 4px;border-bottom:none;margin-top:4px;opacity:.7';
      lbl.textContent = sections[sec]||sec;
      wsaEl.appendChild(lbl);
      lastSec = sec;
    }
    var el = document.createElement('div');
    el.className = 'sb-item';
    el.setAttribute('data-idx', i);
    el.innerHTML = '<span class="sb-num">'+ch.chNum+'</span>'+ch.title;
    el.addEventListener('click',function(){
      go(parseInt(this.getAttribute('data-idx')));
      if(window.innerWidth<=700){toggleSidebar();}
    });
    wsaEl.appendChild(el);
  });
  
  // GE chapters
  var geOffset = WSA_CHAPTERS.length;
  var lastVol = null;
  GE_CHAPTERS.forEach(function(ch,i){
    if(ch.vol!==lastVol){
      var lbl = document.createElement('div');
      lbl.className = 'sb-section';
      lbl.style.cssText = 'font-size:8px;padding:8px 14px 4px;border-bottom:none;margin-top:4px;opacity:.7';
      lbl.textContent = 'Vol '+ch.vol+' — '+ch.volName;
      geEl.appendChild(lbl);
      lastVol = ch.vol;
    }
    var el = document.createElement('div');
    el.className = 'sb-item';
    el.setAttribute('data-idx', geOffset+i);
    el.innerHTML = '<span class="sb-num">'+ch.chNum+'</span>'+ch.title.substring(0,48)+(ch.title.length>48?'&hellip;':'');
    el.addEventListener('click',function(){
      go(parseInt(this.getAttribute('data-idx')));
      if(window.innerWidth<=700){toggleSidebar();}
    });
    geEl.appendChild(el);
  });
}

function updateSidebar(){
  document.querySelectorAll('.sb-item').forEach(function(el){
    el.classList.toggle('active', parseInt(el.getAttribute('data-idx'))===cur);
  });
  // Scroll active into view
  var active = document.querySelector('.sb-item.active');
  if(active) active.scrollIntoView({block:'nearest'});
}

function toggleSidebar(){
  sbOpen = !sbOpen;
  document.getElementById('sb').classList.toggle('open',sbOpen);
  document.getElementById('main').classList.toggle('sb-open',sbOpen&&window.innerWidth>700);
  document.getElementById('b-sb').classList.toggle('on',sbOpen);
}

// ── Navigation ────────────────────────────────────────────────────
function updateNav(){
  document.getElementById('b-prev').disabled = cur<=0;
  document.getElementById('b-next').disabled = cur>=ALL_CHAPTERS.length-1;
  document.getElementById('bn-pos').textContent = (cur+1)+' / '+ALL_CHAPTERS.length;
}

function updateTitle(){
  var ch = ALL_CHAPTERS[cur];
  document.getElementById('tb-title').textContent = ch.title;
}

// ── Font size ─────────────────────────────────────────────────────
function setFs(v){
  fs = Math.min(24,Math.max(12,v));
  document.documentElement.style.setProperty('--fs',fs+'px');
  localStorage.setItem('wsa_fs',fs);
}

// ── Night / Dyslexic ──────────────────────────────────────────────
document.getElementById('b-dk').addEventListener('click',function(){
  document.body.classList.toggle('night');
  this.classList.toggle('on');
  localStorage.setItem('wsa_night',document.body.classList.contains('night')?'1':'0');
});
document.getElementById('b-dy').addEventListener('click',function(){
  document.body.classList.toggle('dyslexic');
  this.classList.toggle('on');
  localStorage.setItem('wsa_dy',document.body.classList.contains('dyslexic')?'1':'0');
});

// ── Progress bar ──────────────────────────────────────────────────
document.getElementById('main').addEventListener('scroll',function(){
  var el = this, pct = el.scrollTop/(el.scrollHeight-el.clientHeight)*100||0;
  document.getElementById('prog-fill').style.width = Math.min(100,pct)+'%';
  document.getElementById('stt').classList.toggle('vis',el.scrollTop>300);
  // Auto-save position every 500px scroll
  savePos();
});

// ── Save / Restore position ───────────────────────────────────────
function savePos(){
  localStorage.setItem('wsa_pos',JSON.stringify({idx:cur,y:document.getElementById('main').scrollTop}));
}
function restorePos(){
  try{
    var p = JSON.parse(localStorage.getItem('wsa_pos')||'null');
    if(p&&p.idx>=0&&p.idx<ALL_CHAPTERS.length){
      go(p.idx);
      setTimeout(function(){document.getElementById('main').scrollTop=p.y||0;},100);
      return;
    }
  }catch(e){}
  go(0);
}

// ── Search ────────────────────────────────────────────────────────
function clearSearch(){
  document.querySelectorAll('mark').forEach(function(m){m.outerHTML=m.innerHTML;});
}
function doSearch(q){
  clearSearch();
  if(!q||q.length<2) return;
  var c = document.getElementById('content'), ql = q.toLowerCase();
  var walker = document.createTreeWalker(c,NodeFilter.SHOW_TEXT,null,false);
  var nodes=[],n,first=null;
  while(n=walker.nextNode()) nodes.push(n);
  nodes.forEach(function(node){
    var t=node.textContent, i=t.toLowerCase().indexOf(ql);
    if(i>=0){
      var r=document.createRange();
      r.setStart(node,i);r.setEnd(node,i+q.length);
      try{
        var m=document.createElement('mark');
        r.surroundContents(m);
        if(!first){first=m;m.classList.add('first-hit');}
      }catch(e){}
    }
  });
  if(first) document.getElementById('main').scrollTop = 
    first.getBoundingClientRect().top + document.getElementById('main').scrollTop - 80;
}

document.getElementById('sq').addEventListener('input',function(){ doSearch(this.value); });
document.getElementById('b-sr').addEventListener('click',function(){
  document.getElementById('sq').value=''; clearSearch();
});

// ── Voice / TTS ───────────────────────────────────────────────────
function initVoice(){
  if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=loadVoices;
  loadVoices();
}
function loadVoices(){
  var voices=window.speechSynthesis&&window.speechSynthesis.getVoices()||[];
  var sel=document.getElementById('vp-voice');
  if(!voices.length) return;
  var saved=localStorage.getItem('wsa_voice');
  sel.innerHTML='';
  var enh=[],other=[];
  voices.forEach(function(v,i){
    if(v.name.indexOf('Enhanced')>=0) enh.push({v,i});
    else other.push({v,i});
  });
  enh.concat(other).forEach(function(item){
    var opt=document.createElement('option');
    opt.value=item.i;opt.textContent=item.v.name+(item.v.lang?' ('+item.v.lang+')':'');
    if(saved&&item.v.name===saved) opt.selected=true;
    sel.appendChild(opt);
  });
}
function getVoice(){
  var voices=window.speechSynthesis.getVoices();
  var saved=localStorage.getItem('wsa_voice');
  if(saved) for(var i=0;i<voices.length;i++) if(voices[i].name===saved) return voices[i];
  var idx=parseInt(document.getElementById('vp-voice').value);
  return(!isNaN(idx)&&voices[idx])||null;
}
function getVoiceText(){
  var c=document.getElementById('content');
  return Array.from(c.querySelectorAll('.body-text,.attorney-text,.evidence-text,.ge-bullet,.ge-fact')).map(function(e){return e.textContent;}).join('. ');
}
function stopVoice(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  document.getElementById('vp-pl').style.display='';
  document.getElementById('vp-pa').style.display='none';
  document.getElementById('vp-status').textContent='Ready';
}

document.getElementById('b-vt').addEventListener('click',function(){
  vpOpen=!vpOpen;
  document.getElementById('vp').classList.toggle('on',vpOpen);
  this.classList.toggle('on',vpOpen);
  if(!vpOpen) stopVoice();
});
document.getElementById('vp-pl').addEventListener('click',function(){
  if(!window.speechSynthesis) return;
  var txt=getVoiceText(); if(!txt) return;
  var u=new SpeechSynthesisUtterance(txt);
  u.voice=getVoice();
  u.rate=parseFloat(document.getElementById('vp-speed').value)||1;
  u.onend=stopVoice; u.onerror=stopVoice;
  u.onstart=function(){
    document.getElementById('vp-pl').style.display='none';
    document.getElementById('vp-pa').style.display='';
    document.getElementById('vp-status').textContent='Reading…';
  };
  window.speechSynthesis.speak(u);
});
document.getElementById('vp-pa').addEventListener('click',function(){
  if(window.speechSynthesis.paused){
    window.speechSynthesis.resume();
    this.style.display='none';
    document.getElementById('vp-pl').style.display='';
  } else {
    window.speechSynthesis.pause();
    this.style.display='none';
    document.getElementById('vp-pl').style.display='';
  }
});
document.getElementById('vp-st').addEventListener('click',stopVoice);
document.getElementById('vp-pv').addEventListener('click',function(){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance('The primary source documentation is the authority. The record speaks for itself.');
  u.voice=getVoice();
  u.rate=parseFloat(document.getElementById('vp-speed').value)||1;
  window.speechSynthesis.speak(u);
});
document.getElementById('vp-voice').addEventListener('change',function(){
  var voices=window.speechSynthesis.getVoices();
  var v=voices[parseInt(this.value)]; if(v) localStorage.setItem('wsa_voice',v.name);
});

// ── Controls ──────────────────────────────────────────────────────
document.getElementById('b-sb').addEventListener('click',toggleSidebar);
document.getElementById('b-prev').addEventListener('click',function(){ if(cur>0) go(cur-1); });
document.getElementById('b-next').addEventListener('click',function(){ if(cur<ALL_CHAPTERS.length-1) go(cur+1); });
document.getElementById('b-fa').addEventListener('click',function(){ setFs(fs-1); });
document.getElementById('b-fg').addEventListener('click',function(){ setFs(fs+1); });
document.getElementById('stt').addEventListener('click',function(){ document.getElementById('main').scrollTop=0; });
document.getElementById('overlay').addEventListener('click',function(){
  document.getElementById('cj-modal').classList.remove('on');
  this.classList.remove('on');
});

// ── Chapter Jump ──────────────────────────────────────────────────
document.getElementById('b-cj').addEventListener('click',function(){
  document.getElementById('cj-modal').classList.add('on');
  document.getElementById('overlay').classList.add('on');
  document.getElementById('cj-input').value='';
  setTimeout(function(){document.getElementById('cj-input').focus();},80);
});
document.getElementById('cj-go').addEventListener('click',function(){
  var q=document.getElementById('cj-input').value.trim().toLowerCase();
  if(!q) return;
  var idx = ALL_CHAPTERS.findIndex(function(c){
    return String(c.chNum).toLowerCase()===q || c.title.toLowerCase().indexOf(q)>=0;
  });
  if(idx>=0){ go(idx); document.getElementById('cj-modal').classList.remove('on'); document.getElementById('overlay').classList.remove('on'); }
  else { document.getElementById('cj-input').style.borderColor='#e74c3c'; }
});
document.getElementById('cj-cancel').addEventListener('click',function(){
  document.getElementById('cj-modal').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
});
document.getElementById('cj-input').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('cj-go').click(); });

// Keyboard navigation
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') { if(cur<ALL_CHAPTERS.length-1) go(cur+1); }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') { if(cur>0) go(cur-1); }
});

// ── Escape key ───────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    document.getElementById('cj-modal').classList.remove('on');
    document.getElementById('overlay').classList.remove('on');
    if(sbOpen) toggleSidebar();
  }
});

// ── Helper ────────────────────────────────────────────────────────
function escH(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Load GE data and init ─────────────────────────────────────────
function initApp(){
  // Restore prefs
  if(localStorage.getItem('wsa_night')==='1') { document.body.classList.add('night'); document.getElementById('b-dk').classList.add('on'); }
  if(localStorage.getItem('wsa_dy')==='1') { document.body.classList.add('dyslexic'); document.getElementById('b-dy').classList.add('on'); }
  setFs(fs);
  
  buildGeIndex();
  buildChapterList();
  buildSidebar();
  initVoice();
  restorePos();
  
  // Hide splash
  setTimeout(function(){
    document.getElementById('splash').classList.add('gone');
  },1400);
}

// Load ge_data.js then init
var geScript = document.createElement('script');
geScript.src = 'ge_data.js';
geScript.onload = initApp;
geScript.onerror = function(){
  // Init without GE data
  buildChapterList();
  buildSidebar();
  initVoice();
  restorePos();
  document.getElementById('splash').classList.add('gone');
};
document.head.appendChild(geScript);

// PWA service worker
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
