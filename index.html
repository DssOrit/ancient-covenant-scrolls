<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:10.5pt;background:#f5f5f0;color:#111;transition:background .2s,color .2s}
body.dark{background:#1a1a1a;color:#e8e8e0}
body.sepia{background:#f4ecd8;color:#3b2a1a}

/* AUTH */
#auth{position:fixed;inset:0;z-index:99999;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
#auth-logo{font-size:56px;font-family:"Segoe UI Historic","Noto Sans Phoenician",serif;color:#e07828;margin-bottom:16px;line-height:1;text-align:center}
#auth-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:4px;text-align:center}
#auth-sub{font-size:13px;color:#aaa;margin-bottom:32px;text-align:center;line-height:1.6}
#auth-btn{width:100%;max-width:320px;background:#e07828;color:#000;font-weight:800;font-size:16px;border:none;border-radius:10px;padding:14px;cursor:pointer}
#auth-loading{position:fixed;inset:0;z-index:99998;background:#0a0a0a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#auth-loading.show{display:flex}
.al-paleo{font-size:40px;font-family:"Segoe UI Historic","Noto Sans Phoenician",serif;color:#e07828}
.al-text{font-size:14px;color:#888}
.al-bar{width:240px;height:3px;background:#222;border-radius:2px;overflow:hidden}
.al-fill{height:100%;width:0;background:#e07828;transition:width 0.4s ease;border-radius:2px}

/* PROGRESS */
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:9000;background:transparent}
#prog-fill{height:3px;background:#666;width:0%;transition:width .1s}
body.dark #prog-fill{background:#999}

/* TOP NAV */
#nav{position:fixed;top:0;left:0;right:0;height:calc(49px + env(safe-area-inset-top,0px));background:#222;display:none;align-items:center;gap:3px;padding:env(safe-area-inset-top,0px) 6px 0;z-index:1000;box-shadow:0 2px 6px rgba(0,0,0,.4);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
body.dark #nav{background:#111}
.nb{background:none;border:none;color:#bbb;cursor:pointer;padding:3px 6px;border-radius:3px;font-size:12px;font-family:Arial;white-space:nowrap;flex-shrink:0}
.nb:hover,.nb.on{background:#444;color:#fff}
#nav-title{flex:1;color:#777;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;min-width:0}
#solar-back{display:none;background:#1a3a5a;color:#7abfff;border:none;border-radius:10px;padding:3px 10px;font-size:11px;cursor:pointer;flex-shrink:0;font-family:Arial;white-space:nowrap;margin-right:2px}
#srch{background:#333;border:1px solid #555;border-radius:3px;color:#ddd;padding:3px 6px;font-size:11px;width:110px;font-family:Arial;flex-shrink:0}
#srch::placeholder{color:#666}

/* SIDEBAR */
#sb{position:fixed;top:calc(49px + env(safe-area-inset-top,0px));left:0;bottom:0;width:265px;background:#1e1e1e;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:900;transition:transform .25s;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px) + 24px)}
#sb.hide{transform:translateX(-265px)}
body.dark #sb{background:#161616}
#sb-ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:899;background:rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent}
#sb-ov.on{display:block}
.ts{padding:8px 12px 4px;color:#666;font-size:8px;font-weight:bold;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid #2a2a2a;margin-top:4px}
.tv{padding:5px 12px 2px;color:#888;font-size:10.5px;font-weight:bold}
.tf{padding:3px 12px 3px 22px;color:#666;font-size:10.5px;cursor:pointer;border-radius:2px}
.tf:hover,.tf.cur{background:#2a2a2a;color:#ddd}
.tf.cur{border-left:2px solid #666;padding-left:20px}

/* MAIN */
:root{--reader-footer-height:170px}
#main{margin-left:265px;margin-top:calc(49px + env(safe-area-inset-top,0px));margin-bottom:0;padding:24px 40px calc(var(--reader-footer-height) + env(safe-area-inset-bottom,0px) + 32px);max-width:860px;transition:margin .25s}
#main.wide{margin-left:0}
@media(max-width:1023px){#main{margin-left:0;padding:14px 14px calc(var(--reader-footer-height) + env(safe-area-inset-bottom,0px) + 32px)}#sb{transform:translateX(-265px)}#sb.mob{transform:translateX(0)}}
#content p{font-family:Arial;line-height:var(--lh,1.65);font-size:var(--fs,10.5pt);margin:.1em 0}

/* HIGHLIGHTS */
.hy{background:#ffeb3b}.hg{background:#90EE90}.hb{background:#87CEEB}.hp{background:#DDA0DD}.ho{background:#FFB347}
body.dark .hy{background:#6a5000;color:#fff}body.dark .hg{background:#1a4a1a;color:#fff}
body.dark .hb{background:#103a5a;color:#fff}body.dark .hp{background:#4a1a5a;color:#fff}
body.dark .ho{background:#5a2a00;color:#fff}
mark{background:#ffeb3b;border-radius:2px}
body.dark mark{background:#5a4a00;color:#fff}

/* HL POPUP */
#hlp{position:fixed;background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:6px 8px;display:none;gap:6px;align-items:center;z-index:8000;box-shadow:0 4px 12px rgba(0,0,0,.5)}
#hlp.show{display:flex}
.hc{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer}
.hx{background:#333;color:#aaa;font-size:11px;border:none;border-radius:3px;padding:2px 6px;cursor:pointer}

/* SINGLE FIXED FOOTER */
#reader-footer{position:fixed;left:0;right:0;bottom:0;width:100%;z-index:1000;background:#111;border-top:1px solid #333;display:none;flex-direction:column;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);max-width:none;margin:0;transform:none}
body.dark #reader-footer{background:#0a0a0a}
#voice-bar{display:none;align-items:center;gap:4px;padding:0 10px;height:44px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;border-bottom:1px solid #222}
#voice-bar.show{display:flex}
#bnav{display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:44px;flex-shrink:0}
.bb{background:#333;color:#ccc;padding:5px 12px;border-radius:4px;font-size:12px;border:none;cursor:pointer;flex-shrink:0}
.bb:hover{background:#555;color:#fff}
.bb:disabled{opacity:.3;cursor:default}
#pos{color:#777;font-size:11px}
.vb{background:#222;color:#bbb;border:none;border-radius:3px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:Arial;white-space:nowrap;flex-shrink:0}
.vb:hover,.vb.on{background:#444;color:#fff}
#vstatus{color:#555;font-size:10px;flex-shrink:0}
#vvol{width:55px;accent-color:#777;cursor:pointer;flex-shrink:0;vertical-align:middle}

/* TOP BUTTON */
#top{position:fixed;bottom:calc(var(--reader-footer-height) + 10px);right:12px;background:#333;color:#bbb;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;display:none;z-index:1001;box-shadow:0 2px 8px rgba(0,0,0,.4)}

#notes-panel{position:fixed;top:49px;right:0;width:280px;bottom:49px;background:#1a1a1a;border-left:1px solid #333;z-index:800;display:none;flex-direction:column}
#notes-panel.show{display:flex}
#notes-hdr{padding:8px 12px;border-bottom:1px solid #333;color:#888;font-size:11px;display:flex;justify-content:space-between}
#notes-ta{flex:1;background:transparent;border:none;color:#ccc;font-size:11px;padding:10px;resize:none;outline:none;line-height:1.6}

#notes-viewer{position:fixed;inset:49px 0 49px;background:#1a1a1a;z-index:850;overflow-y:auto;display:none;padding:16px}
#notes-viewer.show{display:block}
.nve{background:rgba(255,255,255,.03);border-radius:5px;padding:10px;margin-bottom:8px;cursor:pointer;border-left:2px solid #444}
.nve:hover{background:rgba(255,255,255,.06)}
.nvt{color:#666;font-size:9px;margin-bottom:4px}
.nvx{color:#aaa;font-size:11px;line-height:1.5;white-space:pre-wrap}

#ch-jump{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:10px 14px;z-index:2000;display:none;gap:8px;align-items:center}
#ch-jump.show{display:flex}
#ch-in{background:#222;border:1px solid #555;border-radius:4px;color:#ddd;padding:5px 8px;font-size:13px;width:80px;text-align:center}
#ch-go{background:#444;color:#ddd;border:none;border-radius:4px;padding:5px 10px;cursor:pointer}

#recent-panel,#bm-panel{position:fixed;top:49px;left:265px;right:0;background:#1a1a1a;border-bottom:1px solid #333;padding:10px;z-index:700;display:none;flex-wrap:wrap;gap:6px}
#recent-panel.show,#bm-panel.show{display:flex}
.rp,.bp{background:#222;color:#aaa;padding:3px 10px;border-radius:3px;font-size:11px;cursor:pointer}
.rp:hover,.bp:hover{background:#444;color:#fff}

<script>
var _glyphIv=null;
var _GLYPHS=[0x10900,0x10901,0x10902,0x10903,0x10904,0x10905,0x10906,0x10907,0x10908,0x10909,0x1090A,0x1090B,0x1090C,0x1090D,0x1090E,0x10910,0x10912,0x10913,0x10914,0x10915];
function _startGlyphs(){
  var el=document.querySelector('.al-paleo');
  if(!el)return;
  var idx=0;
  _glyphIv=setInterval(function(){
    var s='';
    for(var i=0;i<4;i++)s+=String.fromCodePoint(_GLYPHS[(idx+i)%_GLYPHS.length]);
    el.textContent=s;
    idx=(idx+1)%_GLYPHS.length;
  },320);
}
function _stopGlyphs(){
  clearInterval(_glyphIv);
  _glyphIv=null;
  var el=document.querySelector('.al-paleo');
  if(el)el.innerHTML='&#x10909;&#x10904;&#x10905;&#x10904;';
}
function doEnter(){
  document.getElementById('auth').style.display='none';
  var loading=document.getElementById('auth-loading');
  var fill=document.getElementById('al-fill');
  var txt=document.getElementById('al-text');
  loading.classList.add('show');
  _startGlyphs();
  var msgs=['Opening the Record...','Loading manuscripts...','Preparing volumes...'];
  var pcts=[30,65,100];
  var i=0;
  var iv=setInterval(function(){
    fill.style.width=pcts[i]+'%';
    txt.textContent=msgs[i];
    i++;
    if(i>=msgs.length){
      clearInterval(iv);
      setTimeout(function(){
        _stopGlyphs();
        loading.style.display='none';
        document.getElementById('nav').style.display='flex';
        document.getElementById('reader-footer').style.display='flex';
        document.body.style.background='';
        if(typeof start==='function') start();
      },400);
    }
  },500);
}
function goBackToSolar(){
  document.getElementById('solar-back').style.display='none';
  window.location.href='https://dssorit.github.io/ancient-covenant-scrolls/Solar/';
}
window.addEventListener('load',function(){
  // Splash stays visible until the user taps Enter (doEnter opens the reader).
  if(localStorage.getItem('acr_from_solar')==='1'){
    document.getElementById('solar-back').style.display='block';
    localStorage.removeItem('acr_from_solar');
  }
});
</script>

  CUR=idx;
  localStorage.setItem('acr_last',CUR);
  addRecent(CUR);
  saveNotes();
  var fid=NAVIDS[CUR];
  var lbl=LABELS[CUR];
  document.getElementById('nav-title').textContent=lbl;
  document.getElementById('pos').textContent=(CUR+1)+' of '+NAVIDS.length;
  document.getElementById('btn-prev').disabled=(CUR===0);
  document.getElementById('btn-next').disabled=(CUR===NAVIDS.length-1);
  document.querySelectorAll('.tf').forEach(function(el){
    el.classList.toggle('cur',el.dataset.idx===String(CUR));
  });
  var bms=JSON.parse(localStorage.getItem('acr_bms')||'[]');
  document.getElementById('bm-btn').textContent=bms.indexOf(fid)>=0?'★':'☆';
  var notes=JSON.parse(localStorage.getItem('acr_notes')||'{}');
  document.getElementById('notes-ta').value=notes[fid]||'';
  document.getElementById('notes-lbl').textContent=lbl.split(' — ').slice(0,2).join(' — ');
  document.getElementById('content').innerHTML='<p style="padding:40px;color:#888;text-align:center">Loading…</p>';
  fetch('data/'+fid+'.json')
    .then(function(r){return r.json();})
    .then(function(d){
      document.getElementById('content').innerHTML=d.html||d.content||'';
      applyFS(); applyLH();
      restoreHL(fid);
      vStop(); buildVP();
      var vp=JSON.parse(localStorage.getItem('acr_vp')||'{}');
      VPOS=vp[fid]||0; updateVS();
      if(restore){
        var sp=JSON.parse(localStorage.getItem('acr_sp')||'{}');
        if(sp[fid]) setTimeout(function(){window.scrollTo(0,sp[fid]);},80);
        else window.scrollTo(0,0);
      } else { window.scrollTo(0,0); }
    })
    .catch(function(){
      document.getElementById('content').innerHTML='<p style="padding:20px;color:#888">Error loading section.</p>';
    });
}

function navTo(idx){if(idx>=0&&idx<NAVIDS.length)loadSection(idx,false);}

// SIDEBAR
function buildSB(){
  var h='<div style="padding:6px 12px 4px;color:#444;font-size:8px;letter-spacing:.06em;border-bottom:1px solid #2a2a2a">📖 THE ANCIENT COVENANT RECORD</div>';
  for(var i=0;i<TOC.length;i++){
    var e=TOC[i];
    if(e.type==='sec') h+='<div class="ts">'+e.label+'</div>';
    else if(e.type==='vol') h+='<div class="tv">'+e.label+'</div>';
    else h+='<div class="tf" data-idx="'+e.idx+'" onclick="loadSection('+e.idx+',true)">'+e.label+'</div>';
  }
  h+='<div style="border-top:1px solid #333;margin-top:8px;padding:8px 12px 4px"><a href="ACR2/" style="display:block;color:#aaa;font-size:11px;text-decoration:none;letter-spacing:.04em;padding:6px 0">ACR2 <svg style="width:10px;height:10px;vertical-align:middle;margin-left:2px" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9L9 3M9 3H5M9 3V7"/></svg></a><a href="Solar/" style="display:block;color:#aaa;font-size:11px;text-decoration:none;letter-spacing:.04em;padding:6px 0">ACR Solar <svg style="width:10px;height:10px;vertical-align:middle;margin-left:2px" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9L9 3M9 3H5M9 3V7"/></svg></a><a href="Search/" style="display:block;color:#aaa;font-size:11px;text-decoration:none;letter-spacing:.04em;padding:6px 0">ACR Search <svg style="width:10px;height:10px;vertical-align:middle;margin-left:2px" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9L9 3M9 3H5M9 3V7"/></svg></a></div>';
  document.getElementById('sb').innerHTML=h;
  if(!SB_OPEN&&window.innerWidth>=1024) document.getElementById('sb').classList.add('hide');
}

function toggleSB(){
  if(window.innerWidth<1024){
    var sb=document.getElementById('sb');
    var opening=!sb.classList.contains('mob');
    if(opening){sb.classList.remove('hide');sb.classList.add('mob');}
    else{sb.classList.remove('mob');}
    var isOpen=sb.classList.contains('mob');
    var ov=document.getElementById('sb-ov');
    if(ov) ov.classList.toggle('on',isOpen);
  } else {
    SB_OPEN=!SB_OPEN;
    document.getElementById('sb').classList.toggle('hide',!SB_OPEN);
    document.getElementById('main').classList.toggle('wide',!SB_OPEN);
  }
}

// DISPLAY
function applyFS(){document.getElementById('content').style.setProperty('--fs',FS+'pt');}
function applyLH(){document.getElementById('content').style.setProperty('--lh',LH);}
function adjFS(d){FS=Math.max(8,Math.min(22,FS+d));applyFS();localStorage.setItem('acr_fs',FS);}
function adjLH(d){LH=Math.max(1.2,Math.min(2.5,Math.round((LH+d*.1)*10)/10));applyLH();localStorage.setItem('acr_lh',LH);}
function doDark(){
  document.body.classList.remove('sepia');SEPIA=false;
  DARK=document.body.classList.toggle('dark');
  localStorage.setItem('acr_dark',DARK?'1':'0');
  localStorage.setItem('acr_sepia','0');
  document.getElementById('dark-btn').classList.toggle('on',DARK);
}
function doSepia(){
  if(DARK){document.body.classList.remove('dark');DARK=false;localStorage.setItem('acr_dark','0');}
  SEPIA=document.body.classList.toggle('sepia');
  localStorage.setItem('acr_sepia',SEPIA?'1':'0');
  document.getElementById('sepia-btn').classList.toggle('on',SEPIA);
}
function doRead(){
  READING=!READING;
  document.getElementById('read-btn').classList.toggle('on',READING);
  if(READING){
    document.getElementById('sb').classList.add('hide');
    document.getElementById('main').classList.add('wide');

// SCROLL
function onScroll(){
  var s=window.pageYOffset||0;
  var h=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('prog-fill').style.width=(h>0?Math.round(s/h*100):0)+'%';
  document.getElementById('top').style.display=s>300?'block':'none';
  clearTimeout(SCROLL_T);
  SCROLL_T=setTimeout(function(){
    var sp=JSON.parse(localStorage.getItem('acr_sp')||'{}');
    sp[NAVIDS[CUR]]=s;
    localStorage.setItem('acr_sp',JSON.stringify(sp));
  },3000);
}

// CHAPTER JUMP
function toggleChJump(){document.getElementById('ch-jump').classList.toggle('show');document.getElementById('ch-in').focus();}
function closeChJump(){document.getElementById('ch-jump').classList.remove('show');}
function goChJump(){
  var n=parseInt(document.getElementById('ch-in').value);
  if(!n){closeChJump();return;}
  var paras=document.querySelectorAll('[data-acr]');
  var found=false;
  for(var i=0;i<paras.length;i++){
    var t=paras[i].textContent;
    if(t.match(new RegExp('CHAPTER\\s+'+n+'\\b','i'))||t.match(new RegExp('— CHAPTER '+n+'\\b'))){
      window.scrollTo(0,paras[i].getBoundingClientRect().top+(window.pageYOffset||0)-60);
      found=true;break;
    }
  }
  document.getElementById('ch-in').value='';
  closeChJump();
}

// SEARCH
function doSearch(q){
  document.querySelectorAll('mark').forEach(function(m){m.outerHTML=m.innerHTML;});
  if(!q||q.length<2) return;
  var c=document.getElementById('content'),ql=q.toLowerCase();
  var w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT,null,false);
  var nodes=[],nd;
  while(nd=w.nextNode()) nodes.push(nd);
  var first=null;
  for(var i=0;i<nodes.length;i++){
    var t=nodes[i].textContent,j=t.toLowerCase().indexOf(ql);
    if(j>=0){
      var r=document.createRange();r.setStart(nodes[i],j);r.setEnd(nodes[i],j+q.length);
      try{var m=document.createElement('mark');r.surroundContents(m);if(!first)first=m;}catch(e){}
    }
  }
  if(first) window.scrollTo(0,first.getBoundingClientRect().top+(window.pageYOffset||0)-80);
}

// BOOKMARKS
function toggleBM(){
  var fid=NAVIDS[CUR];
  var bms=JSON.parse(localStorage.getItem('acr_bms')||'[]');
  var i=bms.indexOf(fid);
  if(i>=0){bms.splice(i,1);document.getElementById('bm-btn').textContent='☆';}
  else{bms.push(fid);document.getElementById('bm-btn').textContent='★';}
  localStorage.setItem('acr_bms',JSON.stringify(bms));
  renderBM();
  document.getElementById('bm-panel').classList.toggle('show');
}
function renderBM(){
  var bms=JSON.parse(localStorage.getItem('acr_bms')||'[]');
  var p=document.getElementById('bm-panel');
  if(!bms.length){p.innerHTML='<span style="color:#666;font-size:11px">No bookmarks yet</span>';return;}
  p.innerHTML=bms.map(function(fid){
    var idx=NAVIDS.indexOf(fid);
    var lbl=idx>=0?LABELS[idx].split(' — ').slice(0,2).join(' — '):fid;
    return '<span class="bp" onclick="loadSection('+idx+',true);document.getElementById(\'bm-panel\').classList.remove(\'show\')">'+lbl+'</span>';
  }).join('');
}

// RECENTLY READ
function addRecent(idx){
  var r=JSON.parse(localStorage.getItem('acr_rec')||'[]');
  r=r.filter(function(i){return i!==idx;});
  r.unshift(idx);if(r.length>10)r=r.slice(0,10);
  localStorage.setItem('acr_rec',JSON.stringify(r));
}
function toggleRecent(){
  var p=document.getElementById('recent-panel');
  if(p.classList.toggle('show')){
    var r=JSON.parse(localStorage.getItem('acr_rec')||'[]');
    p.innerHTML=r.length?r.map(function(idx){
      var lbl=LABELS[idx]?LABELS[idx].split(' — ').slice(0,2).join(' — '):'?';
      return '<span class="rp" onclick="loadSection('+idx+',true);document.getElementById(\'recent-panel\').classList.remove(\'show\')">'+lbl+'</span>';
    }).join(''):'<span style="color:#666;font-size:11px">No history yet</span>';
  }
}

// NOTES
function saveNotes(){
  var fid=NAVIDS[CUR];
  var v=document.getElementById('notes-ta').value;
  var n=JSON.parse(localStorage.getItem('acr_notes')||'{}');
  if(v)n[fid]=v;else delete n[fid];
  localStorage.setItem('acr_notes',JSON.stringify(n));
}
function toggleNotes(){
  var p=document.getElementById('notes-panel');
  p.classList.toggle('show');
  document.getElementById('notes-btn').classList.toggle('on',p.classList.contains('show'));
  if(p.classList.contains('show')) document.getElementById('notes-ta').focus();

  var p=document.getElementById('notes-viewer');
  p.classList.toggle('show');
  if(p.classList.contains('show')){
    var n=JSON.parse(localStorage.getItem('acr_notes')||'{}');
    var keys=Object.keys(n);
    document.getElementById('nv-list').innerHTML=keys.length?keys.map(function(fid){
      var idx=NAVIDS.indexOf(fid);
      var lbl=idx>=0?LABELS[idx]:'Unknown';
      return '<div class="nve" onclick="loadSection('+idx+',true);document.getElementById(\'notes-viewer\').classList.remove(\'show\')"><div class="nvt">'+lbl+'</div><div class="nvx">'+n[fid].substring(0,200)+(n[fid].length>200?'…':'')+'</div></div>';
    }).join(''):'<p style="color:#666;font-size:12px">No notes yet.</p>';
  }
}

// HIGHLIGHTING
function onSel(){
  var sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.toString().trim()){hideHL();return;}
  SEL_RANGE=sel.getRangeAt(0).cloneRange();
  var rect=sel.getRangeAt(0).getBoundingClientRect();
  var p=document.getElementById('hlp');
  p.style.top=(rect.bottom+(window.pageYOffset||0)+6)+'px';
  p.style.left=Math.max(4,Math.min(window.innerWidth-200,rect.left+(window.pageXOffset||0)))+'px';
  p.classList.add('show');
}
function hideHL(){document.getElementById('hlp').classList.remove('show');SEL_RANGE=null;}
function applyHL(cls){
  if(!SEL_RANGE) return;
  try{var sp=document.createElement('span');sp.className=cls;SEL_RANGE.surroundContents(sp);}
  catch(e){var f=SEL_RANGE.extractContents();var sp=document.createElement('span');sp.className=cls;sp.appendChild(f);SEL_RANGE.insertNode(sp);}
  saveHL();hideHL();window.getSelection().removeAllRanges();
}
function removeHL(){
  if(!SEL_RANGE) return;
  var n=SEL_RANGE.startContainer;
  while(n&&n!==document.getElementById('content')){
    if(n.nodeType===1&&n.className&&'hy hg hb hp ho'.indexOf(n.className)>=0){
      var p=n.parentNode;while(n.firstChild)p.insertBefore(n.firstChild,n);p.removeChild(n);saveHL();break;
    }
    n=n.parentNode;
  }
  hideHL();
}
function copyHL(){
  var sel=window.getSelection();
  if(sel&&!sel.isCollapsed){try{navigator.clipboard.writeText(sel.toString());}catch(e){document.execCommand('copy');}}
  hideHL();
}
function saveHL(){
  var fid=NAVIDS[CUR];
  var spans=document.getElementById('content').querySelectorAll('.hy,.hg,.hb,.hp,.ho');
  var saved=[];
  spans.forEach(function(s){saved.push({t:s.textContent,c:s.className});});
  HL_DATA[fid]=saved;
  localStorage.setItem('acr_hl',JSON.stringify(HL_DATA));
}
function restoreHL(fid){
  var saved=HL_DATA[fid];if(!saved||!saved.length) return;
  var content=document.getElementById('content');
  saved.forEach(function(h){
    if(!h.t||!h.c) return;
    var w=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,null,false);
    var nd;
    while(nd=w.nextNode()){
      var j=nd.textContent.indexOf(h.t);
      if(j>=0){
        try{var r=document.createRange();r.setStart(nd,j);r.setEnd(nd,j+h.t.length);var sp=document.createElement('span');sp.className=h.c;r.surroundContents(sp);}catch(e){}
        break;
      }
    }
  });
}
document.addEventListener('click',function(e){
  if(!e.target.closest('#hlp')&&!e.target.closest('#content')) hideHL();
});
document.getElementById('content').addEventListener('click',function(e){
  if(!document.getElementById('voice-bar').classList.contains('show')) return;
  var now=Date.now();
  if(now-VTAP_TIME<150){VTAP_TIME=now;return;}
  VTAP_TIME=now;
  // Find the tapped paragraph regardless of tagging (early books are untagged);
  // speakExactElement() decides if it belongs to the current mode's set.
  var el=e.target.closest('#content [data-ptype],#content p.dp');
  if(!el||!document.getElementById('content').contains(el)) return;
  speakExactElement(el);
});

// VOICE
function loadVoices(){
  function doit(){
    VOICES=window.speechSynthesis.getVoices();
    // Default to the Samantha voice when the user hasn't chosen one yet.
    if(localStorage.getItem('acr_vi')===null){
      for(var k=0;k<VOICES.length;k++){ if(/samantha/i.test(VOICES[k].name)){ VIDX=k; break; } }
    }
    var sel=document.getElementById('vvoice');
    sel.innerHTML=VOICES.map(function(v,i){
      var star=(v.name.includes('Enhanced')||v.name.includes('Neural')||v.name.includes('Premium'))?'★ ':'';
      return '<option value="'+i+'"'+(i===VIDX?' selected':'')+'>'+star+v.name.substring(0,26)+'</option>';
    }).join('');
  }
  if(window.speechSynthesis.getVoices().length) doit();
  else window.speechSynthesis.onvoiceschanged=doit;
}
function toggleVoice(){
  var bar=document.getElementById('voice-bar');
  bar.classList.toggle('show');
  document.getElementById('voice-btn').classList.toggle('on',bar.classList.contains('show'));
}
function isVerseEl(el){
  if(!el||!el.getAttribute) return false;
  var pt=el.getAttribute('data-ptype');
  if(pt==='note') return false;
  if(pt==='verse') return true;
  // Untagged early books (files 2-12): a verse paragraph begins with chapter:verse, e.g. 1:1
  return el.classList&&el.classList.contains('dp')&&/^\s*\d+\s*:\s*\d+/.test(el.textContent||'');
}
function buildVP(){
  var mode=VMODE||'verses';
  if(mode==='notes'){
    VPARAS=Array.from(document.querySelectorAll('#content [data-ptype="note"]'));
  } else if(mode==='all'){
    VPARAS=Array.from(document.querySelectorAll('#content p.dp'));
  } else {
    VPARAS=Array.from(document.querySelectorAll('#content [data-ptype="verse"],#content p.dp')).filter(isVerseEl);
  }
}
function pronounce(t){
  return t
    .replace(/𐤉𐤄𐤅𐤄/gu,'').replace(/[𐤀-𐤟]+/gu,'')
    .replace(/\bYHWH\b/g,'Yahweh').replace(/\bYH\b/g,'Yah')
    .replace(/\bMosheh\b/gi,'Mo-sheh').replace(/\bYehoshua\b/gi,'Yeh-ho-shua')
    .replace(/\bChanokh\b/gi,'Hha-nokh').replace(/\bQumran\b/gi,'Koom-rahn')
    .replace(/\bOrit\b/gi,'Oh-reet').replace(/Ge.ez/gi,'Geh-ez')
    .replace(/\bDSS\b/g,'Dead Sea Scrolls').replace(/\[DSS\]/g,'Dead Sea Scrolls note:')
    .replace(/ORIT GE.EZ/gi,'Orit Gezz note:')
    .replace(/\[MASORETIC VARIANT\]/gi,'Masoretic variant note:')
    .replace(/\[CRITICAL NOTE\]/gi,'Critical note:')
    .replace(/[^\x00-\xFF\u0100-\u024F]/g,'');
}
function speakExactElement(el){
  VGEN++;
  var myGen=VGEN;
  window.speechSynthesis.cancel();
  buildVP();
  var idx=VPARAS.indexOf(el);
  if(idx<0) return;
  VPOS=idx;
  VPLAYING=true;
  document.getElementById('vbtn-play').textContent='▶ Playing';
  document.querySelectorAll('#content [data-ptype]').forEach(function(p){p.style.background='';});
  el.style.background='rgba(255,235,59,.15)';
  window.scrollTo(0,el.getBoundingClientRect().top+(window.pageYOffset||0)-80);
  var vp=JSON.parse(localStorage.getItem('acr_vp')||'{}');
  vp[NAVIDS[CUR]]=VPOS;localStorage.setItem('acr_vp',JSON.stringify(vp));
  updateVS();
  var txt=pronounce(el.textContent||'');
  console.log('TAP_AUDIO_DEBUG',{VPOS:VPOS,highlightedText:(el.innerText||'').slice(0,80),spokenText:txt.slice(0,80),counter:(VPOS+1)+'/'+VPARAS.length,VGEN:VGEN});
  var fired=false;
  var u=new SpeechSynthesisUtterance(txt);
  if(VOICES[VIDX]) u.voice=VOICES[VIDX];
  u.rate=VRATE;u.volume=VOL;
  u.onend=function(){if(VGEN!==myGen||fired)return;fired=true;el.style.background='';VPOS++;vNext();};
  u.onerror=function(){if(VGEN!==myGen||fired)return;fired=true;el.style.background='';VPOS++;vNext();};
  Promise.resolve().then(function(){if(VGEN!==myGen)return;window.speechSynthesis.speak(u);});
}
function vPlay(){
  if(VPLAYING) return;
  // Only resume if we explicitly paused — iOS Safari leaves paused=true after
  // cancel(), so checking the flag avoids falsely hitting the resume path after
  // stop or navigation, which would show "Playing" with nothing queued.
  if(VPAUSED && window.speechSynthesis.paused){
    window.speechSynthesis.resume();
    VPAUSED=false;
    VPLAYING=true;document.getElementById('vbtn-play').textContent='▶ Playing';
    return;
  }
  VPAUSED=false;
  buildVP();
  if(!VPARAS.length){
    var modeLabel={'verses':'verses','notes':'notes','all':'content'}[VMODE]||VMODE;
    document.getElementById('vstatus').textContent='No '+modeLabel+' found in this chapter';
    return;
  }
  VGEN++;
  VPLAYING=true;document.getElementById('vbtn-play').textContent='▶ Playing';
  vNext();
}
function vNext(){
  if(!VPLAYING||VPOS>=VPARAS.length){
    if(VPLAYING&&document.getElementById('vauto').checked){
      vStop();setTimeout(function(){navTo(CUR+1);setTimeout(function(){buildVP();VPOS=0;vPlay();},800);},400);
    } else if(VPLAYING){
      VPOS=0;
      document.querySelectorAll('#content [data-ptype]').forEach(function(p){p.style.background='';});
      vNext();
    } else {
      vStop();
    }
    return;
  }
  var para=VPARAS[VPOS];
  var txt=pronounce(para.textContent||'');
  if(!txt.trim()){VPOS++;vNext();return;}
  window.scrollTo(0,para.getBoundingClientRect().top+(window.pageYOffset||0)-80);
  para.style.background='rgba(255,235,59,.15)';
  var vp=JSON.parse(localStorage.getItem('acr_vp')||'{}');
  vp[NAVIDS[CUR]]=VPOS;localStorage.setItem('acr_vp',JSON.stringify(vp));
  updateVS();
  var myGen=VGEN;
  var fired=false;
  var u=new SpeechSynthesisUtterance(txt);
  if(VOICES[VIDX]) u.voice=VOICES[VIDX];
  u.rate=VRATE;u.volume=VOL;
  u.onend=function(){if(VGEN!==myGen||fired)return;fired=true;if(para)para.style.background='';VPOS++;vNext();};
  u.onerror=function(){if(VGEN!==myGen||fired)return;fired=true;if(para)para.style.background='';VPOS++;vNext();};
  window.speechSynthesis.speak(u);
}
function vPause(){window.speechSynthesis.pause();VPAUSED=true;VPLAYING=false;document.getElementById('vbtn-play').textContent='▶ Play';}
function vStop(){
  VGEN++;
  VPAUSED=false;
  window.speechSynthesis.cancel();VPLAYING=false;VPOS=0;
  document.getElementById('vbtn-play').textContent='▶ Play';
  document.querySelectorAll('#content [data-ptype]').forEach(function(p){p.style.background='';});
}
function vSetSpeed(v){VRATE=parseFloat(v);localStorage.setItem('acr_vr',VRATE);}
function vSetVoice(i){VIDX=parseInt(i);localStorage.setItem('acr_vi',VIDX);}
function vSetVol(v){VOL=parseFloat(v);}
function vPreview(){
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance('In the beginning, The Creator created the heavens and the earth.');
  if(VOICES[VIDX]) u.voice=VOICES[VIDX];u.rate=VRATE;u.volume=VOL;
  window.speechSynthesis.speak(u);
}
function updateVS(){
  var fid=NAVIDS[CUR];
  var vp=JSON.parse(localStorage.getItem('acr_vp')||'{}');
  var saved=vp[fid];
  var s=VPLAYING?(VPOS+1)+'/'+VPARAS.length:saved?'Resume v'+saved:'—';
  document.getElementById('vstatus').textContent=s;
}

// SERVICE WORKER
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});
}
