name: JS Syntax Check

on:
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - 'scripts/check-js-syntax.sh'

jobs:
  syntax-check:
    name: Check JS syntax in HTML and JS files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JS syntax check
        run: |
          chmod +x scripts/check-js-syntax.sh
          bash scripts/check-js-syntax.sh
