<text x="470" y="108" font-family="Arial,sans-serif" font-size="20" fill="#cfe9f2">water level</text>
<line x1="60" y1="30" x2="200" y2="40" stroke="#c9b28a" stroke-width="6" stroke-linecap="round"/>
<text x="20" y="22" font-family="Arial,sans-serif" font-size="22" fill="#f2f2f2">rod tip</text>
<path d="M200 40 L240 100" stroke="#ffffff" stroke-width="2" fill="none"/>
<line x1="240" y1="100" x2="240" y2="330" stroke="#ffffff" stroke-width="2"/>
<ellipse cx="240" cy="112" rx="13" ry="22" fill="#e2452f"/>
<rect x="228" y="100" width="24" height="12" fill="#ffffff"/>
<circle cx="240" cy="236" r="12" fill="#9aa3a8"/>
<path d="M240 330 q0 24 22 24 q20 0 20 -22" stroke="#ffffff" stroke-width="4" fill="none"/>
<path d="M282 332 l-8 -10 l16 0 z" fill="#ffffff"/>
<path d="M240 330 q-10 18 -42 8 q-22 -8 -50 6 q-20 10 -34 -4" stroke="#d18a8a" stroke-width="9" fill="none" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" font-size="24" fill="#f2f2f2">
<text x="290" y="170">line</text>
<line x1="286" y1="164" x2="244" y2="164" stroke="#f2f2f2" stroke-width="2"/>
