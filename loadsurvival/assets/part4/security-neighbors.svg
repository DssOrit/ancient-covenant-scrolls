<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 601" role="img"><rect width="1200" height="601" fill="#0f1512"/><rect width="1200" height="118" fill="#223029"/><text x="36" y="43" fill="#9bbf63" font-size="19" font-weight="700">LOAD SURVIVAL • SAFETY SEQUENCE</text><text x="36" y="86" fill="white" font-family="sans-serif" font-weight="bold" font-size="33">Neighborhood mutual aid without vigilantism</text><g font-family="sans-serif"><rect x="35" y="155" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="75" cy="201" r="22" fill="#9bbf63"/><text x="75" y="208" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">1</text><text x="114" y="198" fill="#fff" font-size="19" font-weight="700">Establish contact points</text><text x="114" y="223" fill="#eef2ef" font-size="15"><tspan x="114" dy="25">Agree on a trusted neighbor contact list and</tspan><tspan x="114" dy="25">opt-in communication method.</tspan></text><rect x="620" y="155" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="660" cy="201" r="22" fill="#9bbf63"/><text x="660" y="208" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">2</text><text x="699" y="198" fill="#fff" font-size="19" font-weight="700">Plan welfare checks</text><text x="699" y="223" fill="#eef2ef" font-size="15"><tspan x="699" dy="25">Identify who may need a check-in during</tspan><tspan x="699" dy="25">blackouts, extreme heat or evacuation events.</tspan></text><rect x="35" y="328" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="75" cy="374" r="22" fill="#9bbf63"/><text x="75" y="381" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">3</text><text x="114" y="371" fill="#fff" font-size="19" font-weight="700">Agree on boundaries</text><text x="114" y="396" fill="#eef2ef" font-size="15"><tspan x="114" dy="25">No one is required to share inventories or</tspan><tspan x="114" dy="25">private medical details; respect consent and</tspan><tspan x="114" dy="25">confidentiality.</tspan></text><rect x="620" y="328" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="660" cy="374" r="22" fill="#9bbf63"/><text x="660" y="381" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">4</text><text x="699" y="371" fill="#fff" font-size="19" font-weight="700">Report, do not pursue</text><text x="699" y="396" fill="#eef2ef" font-size="15"><tspan x="699" dy="25">Relay urgent concerns to emergency services and</tspan><tspan x="699" dy="25">avoid approaching suspected offenders.</tspan></text><text x="36" y="576" fill="#dfe6e1" font-size="17">Follow local emergency instructions. This sequence is educational and is not live guidance.</text></g></svg>