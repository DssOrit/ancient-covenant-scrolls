<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 601" role="img"><rect width="1200" height="601" fill="#1a1738"/><rect width="1200" height="118" fill="#322b66"/><text x="36" y="43" fill="#a78bfa" font-size="19" font-weight="700">LOAD SURVIVAL • SAFETY SEQUENCE</text><text x="36" y="86" fill="white" font-family="sans-serif" font-weight="bold" font-size="33">Windows, lighting and perimeter awareness</text><g font-family="sans-serif"><rect x="35" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="201" r="22" fill="#a78bfa"/><text x="75" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">1</text><text x="114" y="198" fill="#fff" font-size="19" font-weight="700">Walk the property</text><text x="114" y="223" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Identify unlit entry points, broken latches and</tspan><tspan x="114" dy="25">obstructed access paths.</tspan></text><rect x="620" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="201" r="22" fill="#a78bfa"/><text x="660" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">2</text><text x="699" y="198" fill="#fff" font-size="19" font-weight="700">Repair and secure</text><text x="699" y="223" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">Maintain functional window locks and replace</tspan><tspan x="699" dy="25">broken glazing; choose appropriate security film</tspan><tspan x="699" dy="25">only after checking…</tspan></text><rect x="35" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="374" r="22" fill="#a78bfa"/><text x="75" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">3</text><text x="114" y="371" fill="#fff" font-size="19" font-weight="700">Light smartly</text><text x="114" y="396" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Use solar or battery-powered motion lighting</tspan><tspan x="114" dy="25">where practical, keeping safe pathways visible.</tspan></text><rect x="620" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="374" r="22" fill="#a78bfa"/><text x="660" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">4</text><text x="699" y="371" fill="#fff" font-size="19" font-weight="700">Balance privacy and escape</text><text x="699" y="396" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">Close curtains to limit views of supplies, while</tspan><tspan x="699" dy="25">preserving easy-to-open emergency exits.</tspan></text><text x="36" y="576" fill="#d9d4f5" font-size="17">Follow local emergency instructions. This sequence is educational and is not live guidance.</text></g></svg>