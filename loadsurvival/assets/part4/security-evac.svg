<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 774" role="img"><rect width="1200" height="774" fill="#1a1738"/><rect width="1200" height="118" fill="#322b66"/><text x="36" y="43" fill="#a78bfa" font-size="19" font-weight="700">LOAD SURVIVAL • SAFETY SEQUENCE</text><text x="36" y="86" fill="white" font-family="sans-serif" font-weight="bold" font-size="33">Leave safely during unrest or evacuation</text><g font-family="sans-serif"><rect x="35" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="201" r="22" fill="#a78bfa"/><text x="75" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">1</text><text x="114" y="198" fill="#fff" font-size="19" font-weight="700">Choose destinations</text><text x="114" y="223" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Prepare a primary destination and a backup away</tspan><tspan x="114" dy="25">from the hazard.</tspan></text><rect x="620" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="201" r="22" fill="#a78bfa"/><text x="660" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">2</text><text x="699" y="198" fill="#fff" font-size="19" font-weight="700">Map routes</text><text x="699" y="223" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">Save offline maps and paper directions, plus a</tspan><tspan x="699" dy="25">route if roads close.</tspan></text><rect x="35" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="374" r="22" fill="#a78bfa"/><text x="75" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">3</text><text x="114" y="371" fill="#fff" font-size="19" font-weight="700">Pack the essentials</text><text x="114" y="396" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Bring identification, medications, water,</tspan><tspan x="114" dy="25">phones, chargers and dependent supplies.</tspan></text><rect x="620" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="374" r="22" fill="#a78bfa"/><text x="660" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">4</text><text x="699" y="371" fill="#fff" font-size="19" font-weight="700">Communicate discreetly</text><text x="699" y="396" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">Tell trusted contacts your plans without public</tspan><tspan x="699" dy="25">posts announcing an empty home.</tspan></text><rect x="35" y="501" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="547" r="22" fill="#a78bfa"/><text x="75" y="554" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">5</text><text x="114" y="544" fill="#fff" font-size="19" font-weight="700">Prioritize people</text><text x="114" y="569" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Leave immediately when officials order</tspan><tspan x="114" dy="25">evacuation or conditions threaten life.</tspan></text><text x="36" y="749" fill="#d9d4f5" font-size="17">Follow local emergency instructions. This sequence is educational and is not live guidance.</text></g></svg>