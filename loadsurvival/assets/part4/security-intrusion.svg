<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 774" role="img"><rect width="1200" height="774" fill="#1a1738"/><rect width="1200" height="118" fill="#322b66"/><text x="36" y="43" fill="#a78bfa" font-size="19" font-weight="700">LOAD SURVIVAL • SAFETY SEQUENCE</text><text x="36" y="86" fill="white" font-family="sans-serif" font-weight="bold" font-size="33">Respond safely to a suspected break-in</text><g font-family="sans-serif"><rect x="35" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="201" r="22" fill="#a78bfa"/><text x="75" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">1</text><text x="114" y="198" fill="#fff" font-size="19" font-weight="700">Recognize danger</text><text x="114" y="223" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">If you notice a forced entry, unknown person, or</tspan><tspan x="114" dy="25">suspicious sounds, avoid approaching the source.</tspan></text><rect x="620" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="201" r="22" fill="#a78bfa"/><text x="660" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">2</text><text x="699" y="198" fill="#fff" font-size="19" font-weight="700">Choose a safer position</text><text x="699" y="223" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">If outside, stay away and move to a safe public</tspan><tspan x="699" dy="25">location. If inside, leave by a safe route when</tspan><tspan x="699" dy="25">possible.</tspan></text><rect x="35" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="374" r="22" fill="#a78bfa"/><text x="75" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">3</text><text x="114" y="371" fill="#fff" font-size="19" font-weight="700">Contact help</text><text x="114" y="396" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Call 911 in the United States or 112 in Portugal</tspan><tspan x="114" dy="25">when there is immediate danger. State your</tspan><tspan x="114" dy="25">location and what you…</tspan></text><rect x="620" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="374" r="22" fill="#a78bfa"/><text x="660" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">4</text><text x="699" y="371" fill="#fff" font-size="19" font-weight="700">If you cannot leave</text><text x="699" y="396" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">Move to a safer room, keep quiet when</tspan><tspan x="699" dy="25">appropriate and follow the emergency</tspan><tspan x="699" dy="25">dispatcher’s instructions.</tspan></text><rect x="35" y="501" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="547" r="22" fill="#a78bfa"/><text x="75" y="554" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">5</text><text x="114" y="544" fill="#fff" font-size="19" font-weight="700">After the incident</text><text x="114" y="569" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Do not disturb evidence if possible. Report the</tspan><tspan x="114" dy="25">incident to local authorities and arrange</tspan><tspan x="114" dy="25">necessary repairs.</tspan></text><text x="36" y="749" fill="#d9d4f5" font-size="17">Follow local emergency instructions. This sequence is educational and is not live guidance.</text></g></svg>