<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 601" role="img"><rect width="1200" height="601" fill="#1a1738"/><rect width="1200" height="118" fill="#322b66"/><text x="36" y="43" fill="#a78bfa" font-size="19" font-weight="700">LOAD SURVIVAL • SAFETY SEQUENCE</text><text x="36" y="86" fill="white" font-family="sans-serif" font-weight="bold" font-size="33">Avoid disaster scams and identity theft</text><g font-family="sans-serif"><rect x="35" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="201" r="22" fill="#a78bfa"/><text x="75" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">1</text><text x="114" y="198" fill="#fff" font-size="19" font-weight="700">Verify the source</text><text x="114" y="223" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Use official agency websites or numbers typed</tspan><tspan x="114" dy="25">independently rather than links sent in</tspan><tspan x="114" dy="25">unexpected messages.</tspan></text><rect x="620" y="155" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="201" r="22" fill="#a78bfa"/><text x="660" y="208" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">2</text><text x="699" y="198" fill="#fff" font-size="19" font-weight="700">Watch impersonators</text><text x="699" y="223" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">Question unsolicited requests for emergency aid</tspan><tspan x="699" dy="25">fees, donations or account verification.</tspan></text><rect x="35" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="75" cy="374" r="22" fill="#a78bfa"/><text x="75" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">3</text><text x="114" y="371" fill="#fff" font-size="19" font-weight="700">Protect documents</text><text x="114" y="396" fill="#e8e4fa" font-size="15"><tspan x="114" dy="25">Store paper copies securely and encrypted</tspan><tspan x="114" dy="25">backups when available.</tspan></text><rect x="620" y="328" width="554" height="149" rx="17" fill="#26214d" stroke="#5a4fb0"/><circle cx="660" cy="374" r="22" fill="#a78bfa"/><text x="660" y="381" text-anchor="middle" font-size="21" fill="#1a1738" font-weight="800">4</text><text x="699" y="371" fill="#fff" font-size="19" font-weight="700">Record suspicious contact</text><text x="699" y="396" fill="#e8e4fa" font-size="15"><tspan x="699" dy="25">Save messages when safe, report to relevant</tspan><tspan x="699" dy="25">authorities, and warn household members.</tspan></text><text x="36" y="576" fill="#d9d4f5" font-size="17">Follow local emergency instructions. This sequence is educational and is not live guidance.</text></g></svg>