<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 774" role="img"><rect width="1200" height="774" fill="#0f1512"/><rect width="1200" height="118" fill="#223029"/><text x="36" y="43" fill="#9bbf63" font-size="19" font-weight="700">LOAD SURVIVAL • SAFETY SEQUENCE</text><text x="36" y="86" fill="white" font-family="sans-serif" font-weight="bold" font-size="33">Recover after theft or property damage</text><g font-family="sans-serif"><rect x="35" y="155" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="75" cy="201" r="22" fill="#9bbf63"/><text x="75" y="208" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">1</text><text x="114" y="198" fill="#fff" font-size="19" font-weight="700">Confirm safety</text><text x="114" y="223" fill="#eef2ef" font-size="15"><tspan x="114" dy="25">Wait for police, fire or utility clearance when</tspan><tspan x="114" dy="25">the site may be hazardous.</tspan></text><rect x="620" y="155" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="660" cy="201" r="22" fill="#9bbf63"/><text x="660" y="208" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">2</text><text x="699" y="198" fill="#fff" font-size="19" font-weight="700">Photograph damage</text><text x="699" y="223" fill="#eef2ef" font-size="15"><tspan x="699" dy="25">Record visible damage from a safe location</tspan><tspan x="699" dy="25">before cleanup, consistent with insurer</tspan><tspan x="699" dy="25">requirements.</tspan></text><rect x="35" y="328" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="75" cy="374" r="22" fill="#9bbf63"/><text x="75" y="381" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">3</text><text x="114" y="371" fill="#fff" font-size="19" font-weight="700">Secure temporary openings</text><text x="114" y="396" fill="#eef2ef" font-size="15"><tspan x="114" dy="25">Arrange lawful emergency repairs and retain</tspan><tspan x="114" dy="25">receipts.</tspan></text><rect x="620" y="328" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="660" cy="374" r="22" fill="#9bbf63"/><text x="660" y="381" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">4</text><text x="699" y="371" fill="#fff" font-size="19" font-weight="700">Update access</text><text x="699" y="396" fill="#eef2ef" font-size="15"><tspan x="699" dy="25">Replace compromised keys, access codes and</tspan><tspan x="699" dy="25">relevant account passwords.</tspan></text><rect x="35" y="501" width="554" height="149" rx="17" fill="#18221d" stroke="#4d6b3f"/><circle cx="75" cy="547" r="22" fill="#9bbf63"/><text x="75" y="554" text-anchor="middle" font-size="21" fill="#0f1512" font-weight="800">5</text><text x="114" y="544" fill="#fff" font-size="19" font-weight="700">Seek support</text><text x="114" y="569" fill="#eef2ef" font-size="15"><tspan x="114" dy="25">Contact insurance and local assistance services</tspan><tspan x="114" dy="25">for recovery and temporary accommodation.</tspan></text><text x="36" y="749" fill="#dfe6e1" font-size="17">Follow local emergency instructions. This sequence is educational and is not live guidance.</text></g></svg>