<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Load Tasks — OCC Setup</title>
<link rel="icon" type="image/png" href="assets/images/load-tasks-logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/load-tasks-icon-192x192.png">
<link rel="apple-touch-icon" href="assets/images/load-tasks-logo.png">
<!--
  OCC one-time setup page. Creates the first logins by calling the OCC API
  (/api/occ/setup) which hashes passwords server-side. Also has a "Test
  login" to prove the backend works end-to-end. Safe to leave in place;
  it does nothing without the SETUP_SECRET you set in Cloudflare.
-->
<style>
  :root{--bg:#0e1016;--card:rgba(30,34,46,.62);--line:rgba(150,160,190,.18);--text:#eef1f8;--muted:#9aa3b8;--blue:#4a9eff;--green:#3ecf8e;--red:#ff5c5c;--gold:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 'Plus Jakarta Sans','Inter',-apple-system,system-ui,sans-serif;padding:24px 16px 80px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:1.4rem;margin:0 0 4px}
  h2{font-size:1.1rem;margin:0 0 10px}
  p{margin:0 0 12px} .muted{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .card.blue{border-left:4px solid var(--blue)} .card.green{border-left:4px solid var(--green)}
  label{display:block;margin:0 0 12px;font-weight:600}
  label span{display:block;margin-bottom:5px;font-size:.92rem;color:var(--muted)}
  input,select{width:100%;background:#10131c;border:1px solid var(--line);border-radius:11px;color:var(--text);font:inherit;font-size:1rem;padding:12px 13px}
  .btn{width:100%;border:0;border-radius:12px;font:inherit;font-weight:700;padding:14px;cursor:pointer;color:#06122a}
  .btn.blue{background:var(--blue)} .btn.green{background:var(--green);color:#04231a}
  .out{margin-top:14px;padding:12px 14px;border-radius:11px;font-weight:600;white-space:pre-wrap;display:none}
  .out.ok{display:block;background:rgba(62,207,142,.14);color:var(--green);border:1px solid rgba(62,207,142,.3)}
  .out.err{display:block;background:rgba(255,92,92,.14);color:var(--red);border:1px solid rgba(255,92,92,.3)}
  .row{display:flex;gap:10px}.row>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>OCC — One-Time Setup</h1>
  <p class="muted">Use this once to create your logins. After it works, you can ignore this page.</p>

  <div class="card blue">
    <h2>1. Create logins</h2>
    <label><span>Setup secret (the SETUP_SECRET you set in Cloudflare)</span>
      <input id="secret" type="password" autocomplete="off" placeholder="your setup secret"></label>
    <div class="row">
      <label><span>Owner name</span><input id="oName" type="text" value="L. Bond"></label>
      <label><span>Owner password</span><input id="oPass" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="choose"></label>
    </div>
    <div class="row">
      <label><span>Employee name</span><input id="eName" type="text" value="Witness Bond"></label>
      <label><span>Employee password</span><input id="ePass" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="choose"></label>
    </div>
    <button class="btn blue" id="createBtn">Create logins</button>
    <div class="out" id="createOut"></div>
  </div>

  <div class="card green">
    <h2>2. Test a login</h2>
    <p class="muted">Proves the backend works. Use one of the logins you just made.</p>
    <label><span>Name</span><input id="tName" type="text" value="Witness Bond"></label>
    <label><span>Role</span><select id="tRole"><option value="employee">Employee</option><option value="owner">Owner</option></select></label>
    <label><span>Password</span><input id="tPass" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="password"></label>
    <button class="btn green" id="testBtn">Test login</button>
    <div class="out" id="testOut"></div>
  </div>
</div>

<script>
"use strict";
var API = '/api/occ';
function show(el, ok, msg){ el.className = 'out ' + (ok ? 'ok' : 'err'); el.textContent = msg; }
async function post(path, body){
  var r = await fetch(API + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  var t = await r.text(); var data; try{ data = JSON.parse(t); }catch(e){ data = { raw:t }; }
  return { status:r.status, data:data };
}
document.getElementById('createBtn').addEventListener('click', async function(){
  var out = document.getElementById('createOut');
  var secret = document.getElementById('secret').value.trim();
  if(!secret){ show(out,false,'Enter your setup secret first.'); return; }
  var users = [
    { name:document.getElementById('oName').value.trim(), role:'owner',    title:'Owner / Admin',                         password:document.getElementById('oPass').value },
    { name:document.getElementById('eName').value.trim(), role:'employee', title:'Platform Quality Assurance Specialist', password:document.getElementById('ePass').value }
  ];
  if(!users[0].password || !users[1].password){ show(out,false,'Choose a password for both.'); return; }
  out.style.display='block'; out.className='out'; out.textContent='Working...';
  try{
    var res = await post('/setup', { secret:secret, users:users });
    if(res.status===200 && res.data.ok) show(out,true,'Done. Created '+res.data.created+' logins. You can now test a login below.');
    else if(res.status===403) show(out,false,'Wrong setup secret (or it is not set in Cloudflare yet).');
    else if(res.status===503) show(out,false,'Database not connected yet. Check the DB binding, then redeploy.');
    else show(out,false,'Error '+res.status+': '+JSON.stringify(res.data));
  }catch(e){ show(out,false,'Network error: '+e.message); }
});
document.getElementById('testBtn').addEventListener('click', async function(){
  var out = document.getElementById('testOut');
  out.style.display='block'; out.className='out'; out.textContent='Working...';
  try{
    var res = await post('/login', { name:document.getElementById('tName').value.trim(), role:document.getElementById('tRole').value, password:document.getElementById('tPass').value });
    if(res.status===200 && res.data.token) show(out,true,'SUCCESS. Backend works. Logged in as '+res.data.user.name+' ('+res.data.user.role+').');
    else if(res.status===401) show(out,false,'Wrong name/role/password.');
    else if(res.status===503) show(out,false,'Database not connected yet.');
    else show(out,false,'Error '+res.status+': '+JSON.stringify(res.data));
  }catch(e){ show(out,false,'Network error: '+e.message); }
});
</script>
</body>
</html>
