<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Load Tasks — OCC</title>
<link rel="icon" type="image/png" href="assets/images/load-tasks-logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/load-tasks-icon-192x192.png">
<link rel="apple-touch-icon" href="assets/images/load-tasks-logo.png">
<!--
  OCC — Operations Command Center (Load Tasks internal module)
  Private employee operations / verification / payment system.
  ADDITIVE MODULE: this is a standalone page. It does not modify any
  existing Load Tasks file other than a single nav link in index.html.
  Data is localStorage-only for MVP. No backend, no cloud upload yet.
  See the "Future backend" comments near the JS credential block for
  Supabase migration notes.
-->
<style>
  :root{
    --bg:#0e1016; --bg2:#13161f; --card:rgba(30,34,46,.62); --card2:rgba(40,45,60,.5);
    --line:rgba(150,160,190,.16); --text:#eef1f8; --muted:#9aa3b8;
    --blue:#4a9eff; --purple:#9b6dff; --green:#3ecf8e; --orange:#ff9f43;
    --red:#ff5c5c; --gold:#ffd166; --gray:#6b7280;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(75,110,255,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(155,109,255,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    font-size:16px; line-height:1.6; letter-spacing:0; font-weight:400;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-weight:600;line-height:1.3;margin:0 0 .5em}
  b,strong{font-weight:600}
  h1{font-size:1.25rem;font-weight:600} h2{font-size:1.08rem} h3{font-size:1rem;font-weight:600}
  p{margin:0 0 .8em} a{color:var(--blue)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  @media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}}

  /* Top bar */
  .occ-top{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,rgba(14,16,22,.96),rgba(14,16,22,.86));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .occ-top .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
  .logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:800}
  .logo small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
  .who{margin-left:auto;text-align:right;font-size:.86rem;line-height:1.3}
  .who b{font-weight:700}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.02em}

  /* Tabs */
  .tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px 0 2px;max-width:1080px;margin:0 auto}
  .tabs button{
    flex:0 0 auto;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);color:var(--muted);
    padding:9px 15px;border-radius:11px;font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;white-space:nowrap;
  }
  .tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;opacity:.7}
  .tabs button.active{border-color:transparent;color:#fff;font-weight:600}
  .tabs button[data-c=blue].active{background:rgba(74,158,255,.18);color:var(--blue)}
  .tabs button[data-c=purple].active{background:rgba(155,109,255,.18);color:var(--purple)}
  .tabs button[data-c=green].active{background:rgba(62,207,142,.18);color:var(--green)}
  .tabs button[data-c=orange].active{background:rgba(255,159,67,.18);color:var(--orange)}
  .tabs button[data-c=red].active{background:rgba(255,92,92,.18);color:var(--red)}
  .tabs button[data-c=gold].active{background:rgba(255,209,102,.18);color:var(--gold)}
  .tabs button[data-c=gray].active{background:rgba(107,114,128,.22);color:#c2c8d6}

  /* Cards */
  .card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:22px;box-shadow:none}
  .card.tint-blue{background:linear-gradient(160deg,rgba(74,158,255,.18),rgba(74,158,255,.04));border-color:rgba(74,158,255,.28)}
  .card.tint-purple{background:linear-gradient(160deg,rgba(155,109,255,.18),rgba(155,109,255,.04));border-color:rgba(155,109,255,.28)}
  .card.tint-green{background:linear-gradient(160deg,rgba(62,207,142,.16),rgba(62,207,142,.04));border-color:rgba(62,207,142,.26)}
  .card.tint-orange{background:linear-gradient(160deg,rgba(255,159,67,.16),rgba(255,159,67,.04));border-color:rgba(255,159,67,.26)}
  .card.tint-red{background:linear-gradient(160deg,rgba(255,92,92,.16),rgba(255,92,92,.04));border-color:rgba(255,92,92,.26)}
  .card.tint-gold{background:linear-gradient(160deg,rgba(255,209,102,.16),rgba(255,209,102,.04));border-color:rgba(255,209,102,.26)}
  .card.tint-gray{background:linear-gradient(160deg,rgba(160,170,190,.10),rgba(160,170,190,.03));border-color:rgba(160,170,190,.16)}
  .card h3{display:flex;align-items:center;gap:9px}

  /* Status chips */
  .chip{display:inline-block;padding:4px 11px;border-radius:999px;font-size:.78rem;font-weight:700}
  .s-green{background:rgba(62,207,142,.16);color:var(--green)}
  .s-orange{background:rgba(255,159,67,.16);color:var(--orange)}
  .s-red{background:rgba(255,92,92,.16);color:var(--red)}
  .s-blue{background:rgba(74,158,255,.16);color:var(--blue)}
  .s-purple{background:rgba(155,109,255,.16);color:var(--purple)}
  .s-gold{background:rgba(255,209,102,.16);color:var(--gold)}
  .s-gray{background:rgba(107,114,128,.2);color:#c2c8d6}

  /* Forms */
  label.fld{display:block;margin:0 0 12px;font-weight:600}
  label.fld span{display:block;margin-bottom:5px;font-size:.92rem;color:var(--muted);font-weight:600}
  input,select,textarea{
    width:100%;background:#10131c;border:1px solid var(--line);border-radius:11px;color:var(--text);
    font:inherit;font-size:1rem;padding:12px 13px;
  }
  textarea{min-height:84px;resize:vertical}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.blue{background:var(--blue);border-color:transparent;color:#06122a}
  .btn.purple{background:var(--purple);border-color:transparent;color:#180a33}
  .btn.green{background:var(--green);border-color:transparent;color:#04231a}
  .btn.gold{background:var(--gold);border-color:transparent;color:#2a2200}
  .btn.red{background:var(--red);border-color:transparent;color:#2a0707}
  .btn.ghost{background:transparent}
  .btn.sm{padding:8px 13px;font-size:.86rem}

  /* Checklist */
  .check{display:flex;align-items:flex-start;gap:13px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .check:last-child{border-bottom:0}
  .check input{width:26px;height:26px;flex:0 0 auto;margin-top:1px;accent-color:var(--green)}
  .check label{font-weight:600;cursor:pointer}
  .progress{height:12px;border-radius:999px;background:#10131c;overflow:hidden;border:1px solid var(--line)}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#8be3bd);width:0;transition:width .3s}

  .list-item{padding:13px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:0}
  .kvs{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.86rem;margin-top:4px}
  .hidden{display:none!important}
  .view{display:none}
  .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Emergency */
  .emg-btn{width:100%;padding:22px;border-radius:18px;border:0;cursor:pointer;
    background:linear-gradient(135deg,#ff5c5c,#c0341f);color:#fff;font-weight:800;font-size:1.25rem;letter-spacing:.03em;
    box-shadow:0 14px 40px rgba(255,60,60,.35)}

  /* Login overlay */
  .gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
    background:radial-gradient(900px 500px at 50% 0%, rgba(75,110,255,.12), transparent 60%),var(--bg)}
  .gate .card{max-width:420px;width:100%}
  .seg{display:flex;gap:8px;margin-bottom:14px}
  .seg button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
  .seg button.on{background:rgba(74,158,255,.18);border-color:transparent;color:var(--blue)}
  .err{color:var(--red);font-weight:700;min-height:1.2em;font-size:.9rem}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:#1b2030;border:1px solid var(--line);
    padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .doc{white-space:pre-wrap;background:#10131c;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:.96rem}
  .backlink{display:inline-block;margin:14px 0 0;color:var(--muted);font-size:.86rem}
  @media print{.occ-top,.tabs,.btn,.backlink,.owner-only-print{display:none!important}.view{display:block!important}.card{box-shadow:none}}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div class="gate" id="gate">
  <div class="card tint-blue">
    <div class="logo" style="margin-bottom:14px"><img src="assets/images/load-tasks-logo.png" alt="Load Tasks" onerror="this.onerror=null;this.src='assets/icons/load-tasks-icon-96x96.png'" style="width:38px;height:38px;border-radius:10px;object-fit:cover;flex:0 0 auto">
      <div>Load Tasks &mdash; OCC<small>Operations Command Center</small></div></div>
    <p class="muted" style="font-size:.92rem">Private employee operations system. Sign in to continue.</p>
    <div class="seg" id="roleSeg">
      <button data-role="employee" class="on">Employee / Verifier</button>
      <button data-role="owner">Owner / Admin</button>
    </div>
    <label class="fld"><span>Name</span><input id="loginName" type="text" autocomplete="off" placeholder="Your name"></label>
    <label class="fld"><span>Password</span><input id="loginPass" type="password" autocomplete="off" placeholder="Password"></label>
    <div class="err" id="loginErr"></div>
    <button class="btn blue" id="loginBtn" style="width:100%;justify-content:center">Sign In</button>
    <p class="muted" style="font-size:.8rem;margin-top:14px">Use the name and password set up for your account.<br>
      Need to create or reset a login? Open <a href="occ-setup.html" style="color:var(--blue)">occ-setup.html</a>.</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="occ-top">
    <div class="bar">
      <div class="logo"><img src="assets/images/load-tasks-logo.png" alt="Load Tasks" onerror="this.onerror=null;this.src='assets/icons/load-tasks-icon-96x96.png'" style="width:38px;height:38px;border-radius:10px;object-fit:cover;flex:0 0 auto">
        <div>Load Tasks &mdash; OCC<small>Operations Command Center</small></div></div>
      <div class="who">
        <div><b id="whoName">—</b> · <span id="whoRole" class="pill"></span></div>
        <div class="muted" id="whoSite">—</div>
        <button class="btn ghost sm" id="logoutBtn" style="margin-top:6px">Log out</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="wrap">
    <!-- Dashboard -->
    <section class="view" data-view="dashboard"></section>
    <!-- Assignments -->
    <section class="view" data-view="assignments"></section>
    <!-- Owner Review -->
    <section class="view" data-view="review"></section>
    <!-- Verify Sections -->
    <section class="view" data-view="verify"></section>
    <!-- Daily tasks -->
    <section class="view" data-view="daily"></section>
    <!-- Issues -->
    <section class="view" data-view="issues"></section>
    <!-- Fix handoff (owner) -->
    <section class="view" data-view="handoff"></section>
    <!-- Evidence -->
    <section class="view" data-view="evidence"></section>
    <!-- Messages -->
    <section class="view" data-view="messages"></section>
    <!-- Emergency -->
    <section class="view" data-view="emergency"></section>
    <!-- Payment -->
    <section class="view" data-view="payment"></section>
    <!-- Invoice -->
    <section class="view" data-view="invoice"></section>
    <!-- How To -->
    <section class="view" data-view="howto"></section>
    <!-- Documents -->
    <section class="view" data-view="documents"></section>
    <!-- Release readiness -->
    <section class="view" data-view="release"></section>
    <!-- Assignment history -->
    <section class="view" data-view="history"></section>
    <!-- Activity history -->
    <section class="view" data-view="activity"></section>
    <!-- Confirmation -->
    <section class="view" data-view="confirm"></section>
    <!-- Data -->
    <section class="view" data-view="data"></section>

    <a class="backlink" href="index.html">&larr; Back to Load Tasks</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================================
   OCC — Operations Command Center  (Load Tasks internal module)
   MVP: localStorage only. No backend. No real cloud upload.

   -------- PLACEHOLDER CREDENTIALS --------
   Change these two passwords before real use. They are intentionally
   obvious placeholders, NOT real secrets. For production, replace this
   USERS array with Supabase/Firebase auth (see FUTURE BACKEND notes below).
   ----------------------------------------- */
var USERS = [
  { name:'Witness Bond', role:'employee', title:'Platform Quality Assurance Specialist', pass:'witness-change-me' },
  { name:'L. Bond',      role:'owner',    title:'Owner / Admin',                         pass:'owner-change-me' }
];
/* FUTURE BACKEND (do not connect yet):
   - Auth: replace login() with Supabase auth.signInWithPassword().
   - DB: replace store() / load() with Supabase table reads/writes.
   - Storage: replace evidence filename list with Supabase Storage uploads.
   - Roles: keep owner/employee; add testers, support, managers in USERS/table.
   - Notifications: emergency alerts -> realtime channel / email webhook.
*/

/* ---------- tiny helpers ---------- */
var $  = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString();}catch(e){return iso;}}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

/* ---------- storage ---------- */
var K = {
  session:'occ_session', assignments:'occ_assignments', checklist:'occ_checklist',
  issues:'occ_issues', evidence:'occ_evidence', messages:'occ_messages',
  alerts:'occ_alerts', payment:'occ_payment', confirm:'occ_confirm', activity:'occ_activity',
  sections:'occ_sections', storage:'occ_storage'
};
function load(key,def){try{var v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;}}
function store(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
/* Activity history (audit trail). Client-side for now; syncs to backend when wired. */
function logActivity(action,detail){
  var a=load(K.activity,[]);
  a.unshift({action:action,detail:detail||'',by:(session()||{}).name||'',at:nowISO()});
  if(a.length>200)a=a.slice(0,200);
  store(K.activity,a);
}

/* ---------- seed data (first run only) ---------- */
var DAILY_SEED = [
  {day:1,title:'Step 1 — Site Inventory',items:[
    'Open https://loadeco.app on Windows Chrome','Confirm homepage loads','Take homepage screenshot',
    'List every visible menu','List every visible section','List every visible tile/card',
    'List every major page discovered','Record notes','Repeat basic access on iPad Safari if available']},
  {day:2,title:'Step 2 — Navigation Audit',items:[
    'Click every visible menu item','Click every visible button','Verify destination loads',
    'Record broken links','Record dead buttons','Mark each item Working, Broken, Confusing, or Needs Retest',
    'Screenshot broken or confusing areas']},
  {day:3,title:'Step 3 — First-Time User Review',items:[
    'Pretend you are a brand-new visitor','Write what the site appears to be','Write whether the next step is clear',
    'Write what is confusing','Write what instructions are missing','Write what would help a new user',
    'Rate overall clarity 1 to 10']},
  {day:4,title:'Step 4 — Browser & Device Comparison',items:[
    'Test in Windows Chrome','Test in Windows Edge','Test on iPad Safari','Record layout differences',
    'Record browser-only issues','Record mobile problems','Record desktop problems','Take screenshots of differences']},
  {day:5,title:'Step 5 — Final Report',items:[
    'Submit site inventory','Submit issue list','Submit browser comparison','Submit top 10 improvement suggestions',
    'Submit release-readiness score','Submit screenshot/video evidence list','Mark assignment ready for owner review']}
];
var CONFIRM_SEED = [
  'I read the assignment','I understand the verification steps','I understand what site to test',
  'I understand not to move to other sites','I understand how to report issues',
  'I understand payment is issued after approval'];

function seed(){
  if(!localStorage.getItem(K.assignments)){
    store(K.assignments,[{
      id:'wk1', title:'Load Eco — Full Section Verification', site:'https://loadeco.app',
      worker:'Witness Bond', week:1, pay:60, bonus:0,
      goal:'Verify that EVERY section of Load Eco actually works before it goes public. List every section, test each one, mark it Works or Broken, and attach evidence (screenshot + note) for each. The site is not ready for sale until every section is verified Working and the owner approves.',
      status:'Not Started', submittedDate:'', approvedDate:'', paidDate:'', ownerNotes:''
    }]);
  }
  if(!localStorage.getItem(K.sections)){
    store(K.sections, SECTION_SEED.map(function(n,i){return {id:'sec_'+i,site:'https://loadeco.app',name:n,status:'Untested',evidence:'',notes:'',ownerOk:false,at:''};}));
  }
  if(!localStorage.getItem(K.checklist)){
    var c={};DAILY_SEED.forEach(function(d){c['day'+d.day]=d.items.map(function(t){return {label:t,done:false};});});
    store(K.checklist,c);
  }
  if(!localStorage.getItem(K.confirm)) store(K.confirm,CONFIRM_SEED.map(function(t){return {label:t,done:false};}));
  if(!localStorage.getItem(K.issues)) store(K.issues,[]);
  if(!localStorage.getItem(K.evidence)) store(K.evidence,[]);
  if(!localStorage.getItem(K.messages)) store(K.messages,[]);
  if(!localStorage.getItem(K.alerts)) store(K.alerts,[]);
  if(!localStorage.getItem(K.activity)) store(K.activity,[]);
  if(!localStorage.getItem(K.sections)) store(K.sections,[]);
}

/* Starter sections for the active site. The employee renames/adds the real
   site-specific sections — these are generic verification targets to begin. */
var SECTION_SEED = ['Homepage loads','Main navigation menu','Each menu link opens','Mobile / iPad layout','Sign-in / gate (if any)','Footer links'];

/* Sites unlock in order: Eco -> Studio -> Play -> AI. Only Load Eco active. */
var SITES = [
  {name:'Load Eco / Main Load', url:'https://loadeco.app', stage:'Active'},
  {name:'Load Studio', url:'https://loadeco.app/loadstudio/', stage:'Locked'},
  {name:'Load Play', url:'https://loadeco.app/LoadPlay/', stage:'Locked'},
  {name:'Load AI', url:'https://loadeco.app/LoadAI/', stage:'Locked'}
];
/* Real page-level areas per site, so the verifier can be set up in one tap.
   Load Eco's list mirrors the actual pages of the site. Add more sites here
   as they unlock. */
var STARTER_SECTIONS = {
  'https://loadeco.app': [
    'Top bar — themes, word size, reset',
    'Front page — tutorial & tool tiles',
    'Help / FAQ page',
    'Import a file page',
    'Workspace popup (file tree, live preview)',
    'Create new page (templates)',
    'Library page (uploads, covers, webapps)',
    'EPUB / webapp reader & viewer',
    'Edit video page'
  ]
};
function starterSectionsFor(url){return STARTER_SECTIONS[url]||[];}
/* Today's Load Eco findings (from the manual QA pass), so they can be
   pre-loaded as Issues in one tap. The epub item routes into ACR and is
   flagged ACR / Blocked — reported, never fixed or linked without the
   owner's explicit approval. {p:page, t:title, s:severity, a:actual, d:device, acr:true?} */
var ECO_FINDINGS = [
  {p:'Top of screen', t:'Aa theme button does nothing', s:'Major', a:'Clicking different themes changes nothing.', d:''},
  {p:'Top of screen', t:'A- / A+ word size buttons do not work', s:'Major', a:'Pressing A- or A+ does not change word size.', d:''},
  {p:'Top of screen', t:'Reset word size button does not work', s:'Major', a:'The reset button for word sizes does nothing.', d:''},
  {p:'Library', t:'Ask AI about this returns no text', s:'Major', a:'"Ask AI about this" says "no text available on this page to copy" when asked to create text to copy to an AI site.', d:''},
  {p:'Front page', t:'Tutorial glitchy off iPad', s:'Minor', a:'Tutorial is glitchy when not opened on iPad.', d:'PC'},
  {p:'Front page', t:'Tutorial auto-speaks (jarring)', s:'Minor', a:'Tutorial automatically speaks, which is jarring.', d:''},
  {p:'Front page', t:'Tutorial circles empty areas', s:'Minor', a:'Tutorial sometimes circles over areas with nothing there.', d:''},
  {p:'Front page', t:'Image prompt does not work', s:'Major', a:'"Image prompt" does not work.', d:''},
  {p:'Front page', t:'Video to audio fails from iPad library', s:'Major', a:'"Video to audio" does not work when pulling from the iPad photo library.', d:'iPad'},

function session(){return load(K.session,null);}
/* ---- backend wiring (online) with offline fallback ---- */
var API_BASE='/api/occ';
function isOnline(){return (session()||{}).mode==='online';}
function authToken(){return (session()||{}).token||'';}
function api(method,path,body){
  var o={method:method,headers:{'Content-Type':'application/json'}};
  if(authToken())o.headers['Authorization']='Bearer '+authToken();
  if(body)o.body=JSON.stringify(body);
  return fetch(API_BASE+path,o).then(function(r){
    return r.text().then(function(t){var d;try{d=JSON.parse(t);}catch(e){d={};}
      if(!r.ok)throw new Error((d&&d.error)||('HTTP '+r.status));return d;});
  });
}
function hydrate(){
  return api('GET','/bootstrap').then(function(d){
    if(d.assignments)store(K.assignments,d.assignments);
    if(d.checklist){var c={};d.checklist.forEach(function(r){var k='day'+r.day;(c[k]=c[k]||[]);c[k][r.idx]={label:r.label,done:!!r.done,id:r.id};});store(K.checklist,c);}
    if(d.issues)store(K.issues,d.issues);
    if(d.evidence)store(K.evidence,d.evidence);
    if(d.messages)store(K.messages,d.messages);
    if(d.alerts)store(K.alerts,d.alerts);
    if(d.sections)store(K.sections,d.sections);
    if(d.storageUsed!=null)store(K.storage,{used:d.storageUsed,cap:d.storageCap,enabled:!!d.storageEnabled});
  });
}
/* optimistic local write already done by caller; push to server then refresh */
function sync(apiCallFn,view){
  if(!isOnline())return;
  apiCallFn().then(hydrate).then(function(){if(view)render(view);}).catch(function(e){toast('Sync failed: '+(e.message||e));});
}

  var u=USERS.filter(function(x){return x.name.toLowerCase()===String(name).trim().toLowerCase() && x.role===role;})[0];

/* ---------- Daily $60 assignment model (opt-in) ----------
   Day assignments are $60/day units (kind 'verify' or 'recert'). The site
   is verified across several days, in order. Rule B gate: after 2 verify
   days where issues were logged, a re-certification day is required before
   any new area unlocks. Until day assignments exist, the app behaves exactly
   as before (whole-site assignment), so nothing live breaks. */
var DAY_PLAN = {
  'https://loadeco.app': [
    {title:'Day 1 — Top bar & Front page', goal:'Verify the top bar (themes, word size, reset) and the Front page (tutorial, tool tiles). Mark each Works or Broken with a screenshot.'},
    {title:'Day 2 — Help/FAQ & Import', goal:'Verify the Help/FAQ page and the Import a file page. Mark each Works or Broken with a screenshot.'},
    {title:'Day 3 — Workspace & Create new', goal:'Verify the Workspace popup (file tree, live preview) and the Create new page. Mark each Works or Broken with a screenshot.'},
    {title:'Day 4 — Library', goal:'Verify the Library page: uploads, covers, webapps. Flag any link that routes into ACR as ACR / Blocked. Mark each Works or Broken with a screenshot.'},
    {title:'Day 5 — EPUB reader & Edit video', goal:'Verify the EPUB/webapp reader and the Edit video page. Mark each Works or Broken with a screenshot.'}
  ]
};
function dayPlanFor(url){return DAY_PLAN[url]||[];}
function dayAssignments(){return load(K.assignments,[]).filter(function(a){return a.kind==='verify'||a.kind==='recert';}).sort(function(x,y){return (x.week||0)-(y.week||0);});}
function dailyMode(){return dayAssignments().length>0;}
function isDayAsg(a){return !!(a&&(a.kind==='verify'||a.kind==='recert'));}
function lastRecertWeek(){var w=0;dayAssignments().forEach(function(a){if(a.kind==='recert'&&(a.status==='Approved'||a.status==='Paid')&&(a.week||0)>w)w=a.week;});return w;}
function dayHadIssues(a){return load(K.issues,[]).some(function(i){return i.assignment===a.id;});}
function issueDaysSinceRecert(){var lr=lastRecertWeek(),n=0;dayAssignments().forEach(function(a){if(a.kind==='verify'&&(a.status==='Approved'||a.status==='Paid')&&(a.week||0)>lr&&dayHadIssues(a))n++;});return n;}
function pendingRecert(){return dayAssignments().filter(function(a){return a.kind==='recert'&&a.status!=='Paid';})[0]||null;}
function recertRequired(){return issueDaysSinceRecert()>=2;}
function gateActive(){return dailyMode()&&recertRequired()&&!pendingRecert();}
function nextDayWeek(){var w=0;dayAssignments().forEach(function(a){if((a.week||0)>w)w=a.week;});return w+1;}
function activeAssignment(){
  if(dailyMode()){
    var pr=pendingRecert();if(pr)return pr;
    var nextVerify=dayAssignments().filter(function(a){return a.kind==='verify'&&a.status!=='Paid';})[0];
    return nextVerify||dayAssignments().filter(function(a){return a.status!=='Paid';})[0]||dayAssignments()[dayAssignments().length-1]||null;
  }
  var site=activeSite();ensureSiteSetup(site);return load(K.assignments,[]).filter(function(x){return x.site===site.url;})[0]||null;
}
function pctCompleteDay(a){
  if(a.status==='Paid')return 100;
  if(a.status==='Approved'||a.status==='Payment Due')return a.invoiceSubmitted?95:80;
  if(a.status==='Submitted')return 60;
  if(a.status==='In Progress')return 30;
  return 0;
}

  var hasProof=load(K.evidence,[]).length>0||load(K.issues,[]).length>0;
  var checks=[

    {label:'Evidence or issues recorded', ok:hasProof},
    {label:'Employee submitted an invoice', ok:!!a.invoiceSubmitted}

  return {checks:checks, pass:checks.every(function(c){return c.ok;})};
}
function canInvoice(a){
  if(isDayAsg(a))return (a.status==='Approved'||a.status==='Payment Due')&&!a.invoiceSubmitted;
  return (a.status==='Approved'||a.status==='Payment Due'||a.status==='Paid')&&pctComplete(a)>=100&&!a.invoiceSubmitted;
}

function rVerify(v){
  var site=activeSite(),owner=isOwner();
  var rows=siteSections(site.url),st=siteVerifyStats(site.url);
  var pct=st.total?Math.round(st.ok/st.total*100):0;
  var ready=st.total>0 && st.ok===st.total && st.approved===st.total;
  var html='<h1>Verify Sections</h1>'+
    '<p class="muted">Check that <b>every section, button, and link</b> of '+esc(site.name)+' actually works before it goes public. Mark each Works or Broken and attach evidence. You <b>verify and report</b> — you do not fix. Broken ones become Issues for the owner to fix, then you retest. No evidence = not verified.</p>'+
    '<div class="card tint-red" style="margin-bottom:14px"><h3>If a link routes into ACR — stop</h3>'+
      '<p class="muted">ACR sites (ACR Reader, ACR2, ACR Solar) are <b>off limits</b>. If a button or link sends you into an ACR site, set that section to <b>ACR / Blocked</b>. Do <b>not</b> test-fix it, follow it as in-scope, or link it. It is set aside for the owner’s explicit approval. ACR / Blocked items are never counted as bugs and never auto-certify the site.</p></div>'+
    '<div class="card tint-green" style="margin-bottom:14px"><h3>'+esc(site.name)+' '+statusChip(ready?'Stable Verified':(st.acr?'Blocked':(st.broken?'Needs Fixes':'In Testing')))+'</h3>'+
      '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
      '<p class="muted" style="margin-top:8px">Verified working: <b>'+st.ok+' / '+st.total+'</b>'+(st.broken?(' · Broken: <b>'+st.broken+'</b>'):'')+(st.acr?(' · ACR / blocked: <b>'+st.acr+'</b>'):'')+' · Owner-approved: <b>'+st.approved+' / '+st.total+'</b></p>'+
      (st.acr?'<p style="color:var(--red);font-weight:700;margin-top:6px">'+st.acr+' section(s) route into ACR (off limits). Cannot be certified or auto-linked without the owner’s explicit approval.</p>':'')+
      (ready?'<p style="color:var(--green);font-weight:700;margin-top:6px">Every section verified + approved — ready for public.</p>':'<p class="muted">Not ready for public until every section is Works + owner-approved.</p>')+

    html+='<div class="card" style="margin-bottom:10px"><h3 style="margin-bottom:8px">'+esc(s.name)+' '+
      '<span class="chip '+stColor+'">'+esc(sectionVerified(s)?'Verified':(s.status))+'</span>'+(s.ownerOk?' <span class="chip s-green">Owner OK</span>':'')+'</h3>'+
      '<label class="fld"><span>Does it work?</span><select data-secstatus="'+s.id+'">'+
        ['Untested','Works','Broken','ACR / Blocked'].map(function(o){return '<option'+(o===s.status?' selected':'')+'>'+o+'</option>';}).join('')+'</select></label>'+
      '<label class="fld"><span>Evidence (screenshot file name) — required</span><input type="text" data-secev="'+s.id+'" value="'+esc(s.evidence||'')+'" placeholder="e.g. eco-homepage.png"></label>'+
      '<label class="fld"><span>Notes</span><input type="text" data-secnotes="'+s.id+'" value="'+esc(s.notes||'')+'"></label>'+
      '<div class="row"><button class="btn sm green" data-secsave="'+s.id+'">Save</button>'+
        (owner?'<button class="btn sm" data-secok="'+s.id+'">'+(s.ownerOk?'Un-approve':'Approve section')+'</button>':'')+
        '<button class="btn sm ghost" data-secdel="'+s.id+'">Delete</button></div></div>';
  });
  v.innerHTML=html;
  // replace this site's rows in the global store, keeping other sites' rows
  function persist(updated){
    var others=load(K.sections,[]).filter(function(x){return x.site!==site.url;});
    store(K.sections,others.concat(updated));
  }
  $('#secAdd',v).addEventListener('click',function(){
    var n=$('#secNew',v).value.trim();if(!n){toast('Type a section name');return;}

    else render('verify');

    if(r.status==='ACR / Blocked'){toast('Flagged ACR / Blocked. ACR is off limits — left for the owner, not fixed or linked.');}
    persist(rows);if(sectionVerified(r))logActivity('Section verified',r.name);render('verify');sync(function(){return api('PATCH','/sections/'+id,{status:r.status,evidence:r.evidence,notes:r.notes});},'verify');

  });});

  });});
}

  var L=[];

  var issues=load(K.issues,[]);
  function isOpen(i){return i.status!=='Verified Fixed'&&i.status!=='Closed';}
  function isACR(i){return /\[ACR/i.test(i.title||'')||/ACR\s*\/\s*BLOCKED/i.test(i.notes||'');}
  var open=issues.filter(isOpen);
  var fixable=open.filter(function(i){return !isACR(i);});

/* Shrink an image on the device BEFORE upload, so only a small thumbnail
   is stored in the database (keeps it light, no R2, no payment needed). */
function downscaleImage(file,maxDim,quality,cb){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,maxDim/Math.max(w,h));
    var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
    var c=document.createElement('canvas');c.width=cw;c.height=ch;
    c.getContext('2d').drawImage(img,0,0,cw,ch);
    URL.revokeObjectURL(url);
    try{cb(c.toDataURL('image/jpeg',quality));}catch(e){cb(null);}
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb(null);};
  img.src=url;
}
/* Upload a downscaled screenshot (data URL) to the API; it is stored in D1. */
function uploadEvidence(dataUrl,fields,cb){
  var bodyObj={dataUrl:dataUrl,name:fields.name||'',issue:fields.issue||'',browser:fields.browser||'',device:fields.device||'',notes:fields.notes||''};
  fetch(API_BASE+'/evidence/upload',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken()},body:JSON.stringify(bodyObj)})
    .then(function(r){return r.text().then(function(t){var d;try{d=JSON.parse(t);}catch(e){d={};}return {ok:r.ok,status:r.status,d:d};});})
    .then(cb).catch(function(e){cb({ok:false,status:0,d:{error:e.message||'network'}});});
}

/* Auto-check that must pass before the owner pays — protects against
   paying for incomplete or unverified work. */
function payAutoCheck(a){
  if(isDayAsg(a))return payAutoCheckDay(a);
  var vs=siteVerifyStats(a.site),steps=checklistStats();
  var checks=[
    {label:'Owner approved the assignment', ok:(a.status==='Approved'||a.status==='Paid')},
    {label:'Every section verified Working (with evidence)', ok:vs.total>0&&vs.ok===vs.total},
    {label:'Every section owner-approved', ok:vs.total>0&&vs.approved===vs.total},
    {label:'All verification steps done', ok:steps.total>0&&steps.done===steps.total},
    {label:'Employee submitted an invoice', ok:!!a.invoiceSubmitted}
  ];
  return {checks:checks, pass:checks.every(function(c){return c.ok;})};
}
/* Percent of the $60 assignment actually completed (work done). */
function pctComplete(a){
  if(isDayAsg(a))return pctCompleteDay(a);
  var vs=siteVerifyStats(a.site),steps=checklistStats();
  var secPct=vs.total?vs.ok/vs.total:0;
  var stepPct=steps.total?steps.done/steps.total:0;
  var apprPct=vs.total?vs.approved/vs.total:0;
  return Math.round((secPct*0.6 + stepPct*0.3 + apprPct*0.1)*100);
}

  // Screenshots — how proof works (matches the current MVP: record file names, no upload button yet)

    '<p style="margin:0 0 6px"><b>Way 1 — Upload the picture (recommended).</b></p>'+

function readinessScore(){
  var issues=load(K.issues,[]),s=checklistStats();
  var crit=issues.filter(function(i){return i.severity==='Critical'&&i.status!=='Verified Fixed'&&i.status!=='Closed';}).length;
  var major=issues.filter(function(i){return i.severity==='Major'&&i.status!=='Verified Fixed'&&i.status!=='Closed';}).length;
  var score=Math.round(s.pct*0.7) + 30 - crit*15 - major*5;
  return Math.max(0,Math.min(100,score));
}
function rRelease(v){
  var issues=load(K.issues,[]),all=load(K.assignments,[]);
  var crit=issues.filter(function(i){return i.severity==='Critical'&&i.status!=='Closed'&&i.status!=='Verified Fixed';}).length;
  var major=issues.filter(function(i){return i.severity==='Major'&&i.status!=='Closed'&&i.status!=='Verified Fixed';}).length;
  var retestsOpen=issues.filter(function(i){return i.status==='Needs Retest';}).length;
  var html='<h1>Release Certification</h1><p class="muted">Each Load site earns a certification record. Sites unlock in order — Load Eco → Studio → Play → AI.</p>';
  var act=activeSite();
  SITES.forEach(function(site){
    var certified=siteCertified(site.url), locked=siteLocked(site.url), active=(site.url===act.url)&&!certified;
    var sa=all.filter(function(x){return x.site===site.url;})[0];
    var vs=siteVerifyStats(site.url);
    var siteIssues=issues.filter(function(i){return i.site===site.name;});
    var bugsFound=siteIssues.length;
    var bugsFixed=siteIssues.filter(function(i){return i.status==='Verified Fixed'||i.status==='Closed';}).length;
    var retestsOpen2=siteIssues.filter(function(i){return i.status==='Needs Retest';}).length;
    var ownerApproved=sa&&(sa.status==='Approved'||sa.status==='Paid');
    var stage=certified?'Stable Verified':(locked?'Locked':(vs.broken?'Needs Fixes':'In Testing'));
    var tint=certified?'green':(active?'blue':'gray');
    html+='<div class="card tint-'+tint+'" style="margin-bottom:12px">'+
      '<h3>'+esc(site.name)+' '+statusChip(stage)+'</h3>'+
      '<div class="muted" style="font-size:.85rem">'+esc(site.url)+'</div>'+
      (locked?
        '<p class="muted" style="margin-top:8px">Locked. Unlocks when '+esc(act.name)+' is certified Ready for public.</p>'
       :'<div class="kvs" style="margin-top:8px"><span>Sections verified: <b>'+vs.ok+' / '+vs.total+'</b></span><span>Sections owner-approved: <b>'+vs.approved+' / '+vs.total+'</b></span><span>Bugs found: <b>'+bugsFound+'</b></span><span>Bugs fixed: <b>'+bugsFixed+'</b></span><span>Open retests: <b>'+retestsOpen2+'</b></span><span>Owner approval: <b>'+(ownerApproved?'Yes':'No')+'</b></span></div>'+
        (certified?'<p style="color:var(--green);font-weight:700;margin-top:6px">CERTIFIED — Ready for public. Next site is unlocked.</p>':'<p class="muted" style="margin-top:6px">Not certified yet: every section must be verified Working and owner-approved.</p>'))+
    '</div>';
  });
  v.innerHTML=html;
}

      '<h3>'+esc(a.title)+' '+statusChip(a.status)+'</h3>'+

      '<div class="kvs"><span>Submitted: '+fmtDate(a.submittedDate)+'</span><span>Approved: '+fmtDate(a.approvedDate)+'</span><span>Paid (completed): '+fmtDate(a.paidDate)+'</span></div>'+

function rData(v){
  v.innerHTML='<h1>OCC Data</h1>'+
    '<div class="card tint-gray"><p class="muted">All OCC data is stored only in this browser (localStorage). It is not synced to any server.</p>'+
      '<div class="row"><button class="btn" id="dExport">Export OCC Data</button><button class="btn" id="dImport">Import OCC Data</button><button class="btn red ghost" id="dReset">Reset Demo Data</button></div>'+
      '<input type="file" id="dFile" accept="application/json" class="hidden"></div>';
  $('#dExport',v).addEventListener('click',function(){
    var dump={};Object.keys(K).forEach(function(k){if(k!=='session')dump[k]=load(K[k],null);});
    download('occ-data-backup.json',JSON.stringify(dump,null,2));
  });
  $('#dImport',v).addEventListener('click',function(){$('#dFile',v).click();});
  $('#dFile',v).addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var o=JSON.parse(r.result);Object.keys(o).forEach(function(k){if(K[k]&&k!=='session')store(K[k],o[k]);});toast('Data imported');render('data');}catch(err){toast('Invalid file');}};
    r.readAsText(f);
  });
  $('#dReset',v).addEventListener('click',function(){
    if(!confirm('Reset OCC demo data? This clears assignments, issues, evidence, messages, payments and checklists in this browser.'))return;
    Object.keys(K).forEach(function(k){if(k!=='session')localStorage.removeItem(K[k]);});seed();toast('Demo data reset');render('data');
  });
}

/* form builders */
function fld(id,label,type){return '<label class="fld"><span>'+esc(label)+'</span><input id="'+id+'" type="'+(type||'text')+'"></label>';}
function fldArea(id,label){return '<label class="fld"><span>'+esc(label)+'</span><textarea id="'+id+'"></textarea></label>';}
function fldSel(id,label,opts){return '<label class="fld"><span>'+esc(label)+'</span><select id="'+id+'">'+opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select></label>';}
function download(name,text){var a=document.createElement('a');a.href='data:application/octet-stream,'+encodeURIComponent(text);a.download=name;a.click();}

/* ---------- boot ---------- */
function applyRoleVisibility(){
  var owner=isOwner();
  $$('.owner-only').forEach(function(e){e.classList.toggle('hidden',!owner);});
}
function startApp(){
  var s=session();if(!s)return;
  $('#gate').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#whoName').textContent=s.name;
  var rp=$('#whoRole');rp.textContent=s.role==='owner'?'Owner / Admin':'Employee / Verifier';
  rp.className='pill '+(s.role==='owner'?'s-blue':'s-purple');
  var a=activeAssignment();$('#whoSite').textContent=(isOnline()?'':'OFFLINE (this device only) · ')+(a?('Site under test: '+a.site):'');
  buildTabs();show('dashboard');
}

(function init(){
  seed();
  // login gate wiring
  var role='employee';
  $$('#roleSeg button').forEach(function(b){b.addEventListener('click',function(){
    role=b.dataset.role;$$('#roleSeg button').forEach(function(x){x.classList.toggle('on',x===b);});
  });});
  function doLogin(){
    var name=$('#loginName').value, pass=$('#loginPass').value;
    $('#loginErr').textContent='Signing in...';
    api('POST','/login',{name:name,role:role,password:pass}).then(function(res){
      store(K.session,{name:res.user.name,role:res.user.role,title:res.user.title,token:res.token,mode:'online',at:nowISO()});
      return hydrate().then(function(){$('#loginErr').textContent='';startApp();});
    }).catch(function(e){
      if(/HTTP 401|invalid/i.test(e.message||'')){$('#loginErr').textContent='Wrong name or password for this role.';return;}
      // server unreachable -> offline fallback (placeholder local logins only)
      if(login(name,pass,role)){var s=load(K.session,{});s.mode='offline';store(K.session,s);$('#loginErr').textContent='';startApp();}
      else{$('#loginErr').textContent='Cannot reach the server. Check your internet, or use the offline placeholder login.';}
    });
  }
  $('#loginBtn').addEventListener('click',doLogin);
  $('#loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  $('#logoutBtn').addEventListener('click',logout);
  if(session())startApp();
})();
</script>
