<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Great Eraser"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>The Great Eraser</title>
<style>
/* === THEME VARIABLES === */
:root{
  --bg:#FFFFFF;--bg2:#F8F8F8;--bg3:#F0F0F0;
  --sidebar-bg:#F5F5F5;--sidebar-border:#DDDDDD;
  --text:#111111;--text2:#444444;--text3:#777777;
  --header-bg:#222222;--header-text:#EEEEEE;--header-sub:#AAAAAA;
  --border:#DDDDDD;--border2:#CCCCCC;
  --accent:#222222;--accent2:#444444;
  --btn-bg:#F0F0F0;--btn-border:#CCCCCC;--btn-hover:#E0E0E0;
  --note-dss:#1A5276;--note-dss-bg:#F4F8FC;
  --note-orit:#1E8449;--note-orit-bg:#F4FCF6;
  --note-maso:#7D6608;--note-maso-bg:#FDFAF0;
  --note-crit:#6E2F8A;--note-crit-bg:#FAF4FC;
  --fact-bg:#F7F7F7;--fact-border:#333333;
  --section-color:#333333;--part-color:#888888;
  --source-color:#777777;
  --progress-bg:#EEEEEE;--progress-fill:#444444;
  --highlight-y:#FFEE44;--highlight-g:#88FF88;--highlight-b:#88CCFF;--highlight-p:#CC88FF;--highlight-o:#FFAA44;
  --reading-bar-bg:#222222;--reading-bar-border:#444444;
  --modal-bg:rgba(0,0,0,0.55);--modal-inner:#FFFFFF;
  --input-bg:#FFFFFF;--input-border:#CCCCCC;
  --search-hl:#FFEE88;
}
body.dark{
  --bg:#0D0B07;--bg2:#161309;--bg3:#1E1A0F;
  --sidebar-bg:#111109;--sidebar-border:#2A2510;
  --text:#F0EAD6;--text2:#C8BC9A;--text3:#8A7E62;
  --header-bg:#0A0904;--header-text:#EEE8D0;--header-sub:#7A7060;
  --border:#2E2510;--border2:#3A3018;
  --accent:#C9A84C;--accent2:#8B6914;
  --btn-bg:#1C1708;--btn-border:#3A3018;--btn-hover:#2A2210;
  --note-dss-bg:#0C1520;--note-orit-bg:#0B1A10;--note-maso-bg:#1A1500;--note-crit-bg:#150B1E;
  --fact-bg:#141008;--fact-border:#8B6914;
  --section-color:#C9A84C;--part-color:#7A7060;
  --source-color:#6A6050;
  --progress-bg:#2A2510;--progress-fill:#8B6914;
  --modal-bg:rgba(0,0,0,0.8);--modal-inner:#161309;
  --input-bg:#1C1708;--input-border:#3A3018;
  --search-hl:#8B6914;
}
body.sepia{
  --bg:#F4EDD8;--bg2:#EDE4CC;--bg3:#E5DABC;
  --sidebar-bg:#EDE4CC;--sidebar-border:#C8B890;
  --text:#2C1E0A;--text2:#5C4020;--text3:#8C7050;
  --header-bg:#3C2A10;--header-text:#F0E0B8;--header-sub:#A08060;
  --border:#C8B890;--border2:#B0A070;
  --btn-bg:#E5DABC;--btn-border:#B0A070;--btn-hover:#D8CCAA;
  --fact-bg:#EDE4CC;--progress-fill:#5C4020;
  --section-color:#3C2A10;--part-color:#6C5030;
  --modal-inner:#F4EDD8;--input-bg:#F4EDD8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .2s,color .2s}

/* === LOCK SCREEN === */
#lockScreen{position:fixed;inset:0;z-index:9999;background:#1A1A1A;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.lock-logo{font-family:Arial,sans-serif;font-size:1.4rem;font-weight:bold;color:#EEEEEE;margin-bottom:8px;text-align:center}
.lock-sub{font-size:.76rem;color:#888888;text-align:center;margin-bottom:4px}
.lock-input{width:240px;padding:10px 14px;border:1px solid #444444;border-radius:6px;background:#2A2A2A;color:#FFFFFF;font-family:Arial,sans-serif;font-size:.9rem;text-align:center;letter-spacing:.05em;outline:none}
.lock-input:focus{border-color:#888888}
.lock-btn{width:240px;padding:10px;border:none;border-radius:6px;background:#444444;color:#FFFFFF;font-family:Arial,sans-serif;font-size:.86rem;font-weight:bold;cursor:pointer;transition:background .2s}
.lock-btn:hover{background:#666666}
.lock-err{color:#CC4444;font-size:.78rem;height:18px;text-align:center}

/* === HEADER === */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;background:var(--header-bg);border-bottom:2px solid var(--border2);display:flex;align-items:center;padding:0 12px;gap:8px}
.hdr-menu{background:none;border:none;cursor:pointer;color:var(--header-text);padding:8px;border-radius:5px;flex-shrink:0;transition:background .2s}
.hdr-menu:hover{background:rgba(255,255,255,.1)}
.hdr-menu svg{display:block}
.hdr-title{flex:1;font-family:Arial,sans-serif;font-size:.86rem;font-weight:bold;color:var(--header-text);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title .pos{color:var(--header-sub);font-weight:normal;font-size:.72rem}
.hdr-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--header-sub);padding:7px;border-radius:5px;transition:all .2s;font-size:0;line-height:0;position:relative}
.icon-btn:hover{color:var(--header-text);background:rgba(255,255,255,.1)}
.icon-btn svg,.icon-btn span.ic{display:block}
.icon-btn span.ic{font-size:14px;line-height:1;color:inherit}

/* === LAYOUT === */
.layout{display:flex;min-height:100vh;padding-top:52px}

/* === SIDEBAR === */
.sidebar{position:fixed;top:52px;left:0;bottom:0;width:288px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);overflow-y:auto;z-index:100;transition:transform .25s ease;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.sidebar.hidden{transform:translateX(-100%)}
.sb-hdr{padding:10px 12px;border-bottom:1px solid var(--sidebar-border);flex-shrink:0}
.sb-hdr h2{font-size:.72rem;font-weight:bold;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.sb-tools{display:flex;gap:4px;flex-wrap:wrap}
.sb-btn{background:none;border:1px solid var(--btn-border);border-radius:4px;cursor:pointer;color:var(--text2);padding:5px 8px;font-family:Arial,sans-serif;font-size:.7rem;transition:all .2s;white-space:nowrap}
.sb-btn:hover{background:var(--btn-hover);color:var(--text)}
.sb-search-wrap{padding:7px 10px;border-bottom:1px solid var(--sidebar-border);flex-shrink:0}
.sb-search{width:100%;padding:6px 9px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text);font-family:Arial,sans-serif;font-size:.78rem;outline:none}
.sb-search:focus{border-color:var(--accent2)}
.vol-list{flex:1;overflow-y:auto;padding:4px 0}
.vol-item{border-bottom:1px solid var(--sidebar-border)}
.vol-btn{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:8px 10px;display:flex;align-items:flex-start;gap:7px;transition:background .15s}
.vol-btn:hover{background:var(--btn-hover)}
.vol-btn.active{background:var(--btn-hover)}
.v-num{font-size:.66rem;font-weight:bold;color:var(--text3);min-width:28px;letter-spacing:.04em;margin-top:1px}
.v-txt{flex:1}
.v-name{font-size:.78rem;color:var(--text);font-weight:bold;line-height:1.3}
.v-desc{font-size:.66rem;color:var(--text3);margin-top:1px;line-height:1.25}
.v-arrow{margin-left:auto;color:var(--text3);font-size:.9rem;transition:transform .2s;flex-shrink:0;margin-top:2px}
.vol-btn.open .v-arrow{transform:rotate(90deg)}
.ch-list{background:var(--bg2);border-top:1px solid var(--border);display:none}
.ch-list.open{display:block}
.ch-btn{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:5px 10px 5px 22px;font-family:Arial,sans-serif;font-size:.72rem;color:var(--text2);border-bottom:1px solid var(--border);transition:background .15s;line-height:1.35}
.ch-btn:hover{background:var(--btn-hover);color:var(--text)}
.ch-btn.active{background:var(--btn-hover);color:var(--text);font-weight:bold}

/* === MAIN === */
.main{flex:1;margin-left:288px;min-height:100vh;transition:margin .25s ease;background:var(--bg)}
.main.full{margin-left:0}
.main.reading-mode .hdr-actions .icon-btn:not(#readModeBtn){opacity:0;pointer-events:none}

/* === PROGRESS === */
.progress-bar{position:fixed;top:52px;left:0;right:0;height:3px;background:var(--progress-bg);z-index:150}
.progress-fill{height:100%;background:var(--progress-fill);width:0%;transition:width .15s}

/* === SCROLL TO TOP === */
#scrollTopBtn{position:fixed;bottom:80px;right:16px;z-index:160;background:var(--accent2);color:#FFFFFF;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.1rem;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:all .2s}
#scrollTopBtn.visible{display:flex}
#scrollTopBtn:hover{opacity:.85}

/* === WELCOME === */
.welcome{max-width:740px;margin:0 auto;padding:36px 22px 60px}
.welcome-title{font-size:1.6rem;font-weight:bold;color:var(--text);margin-bottom:6px;line-height:1.2}
.welcome-sub{font-size:.9rem;color:var(--text2);margin-bottom:18px;line-height:1.5}
.welcome-divider{border:none;border-top:2px solid var(--accent2);margin:18px 0}
.welcome-meta{font-size:.78rem;color:var(--text2);margin-bottom:5px;line-height:1.5}
.welcome-excl{font-size:.74rem;color:var(--text3);font-style:italic;line-height:1.5}
.vol-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-top:22px}
.vol-card{border:1px solid var(--border);border-radius:5px;padding:11px;cursor:pointer;background:var(--bg2);transition:all .2s}
.vol-card:hover{background:var(--bg3);border-color:var(--accent2)}
.vc-num{font-size:.64rem;font-weight:bold;color:var(--text3);letter-spacing:.05em;margin-bottom:3px}
.vc-name{font-size:.84rem;font-weight:bold;color:var(--text);margin-bottom:3px;line-height:1.3}
.vc-desc{font-size:.7rem;color:var(--text3);line-height:1.3}

/* === CHAPTER VIEW === */
.chapter-view{max-width:740px;margin:0 auto;padding:30px 22px 80px}
.ch-hdr{margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border2)}
.ch-vol-label{font-size:.64rem;font-weight:bold;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.ch-number{font-size:.76rem;font-weight:bold;color:var(--text2);margin-bottom:3px}
.ch-title{font-size:1.15rem;font-weight:bold;color:var(--text);line-height:1.3}

/* === CONTENT === */
.para{font-family:Arial,sans-serif;font-size:.9rem;color:var(--text);line-height:1.7;margin-bottom:10px}
.section-banner{font-family:Arial,sans-serif;font-size:.83rem;font-weight:bold;font-style:italic;color:var(--section-color);text-align:center;margin:18px 0 9px;padding:6px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.xref-hdr{font-family:Arial,sans-serif;font-size:.74rem;font-weight:bold;color:var(--text2);margin:24px 0 9px;padding:6px 10px;background:var(--bg3);border-left:3px solid var(--accent2);letter-spacing:.04em;text-transform:uppercase}
.part-banner{font-family:Arial,sans-serif;font-size:.74rem;font-weight:bold;color:var(--part-color);text-transform:uppercase;letter-spacing:.07em;text-align:center;margin:26px 0 16px;padding:8px 0;border-top:2px solid var(--accent2);border-bottom:2px solid var(--accent2)}
.source-line{font-family:Arial,sans-serif;font-size:.72rem;font-style:italic;color:var(--source-color);margin:3px 0 11px;padding-left:12px;border-left:2px solid var(--border);line-height:1.5}
.bullet-item{font-family:Arial,sans-serif;font-size:.86rem;color:var(--text);line-height:1.6;margin-bottom:4px;padding-left:16px;position:relative}
.bullet-item::before{content:"▸";position:absolute;left:0;color:var(--text3)}

/* NOTE BOXES */
.note-box{margin:11px 0;padding:8px 11px;border-left:4px solid var(--note-dss);border-radius:0 4px 4px 0}
.note-box.dss{border-left-color:var(--note-dss);background:var(--note-dss-bg)}
.note-box.orit{border-left-color:var(--note-orit);background:var(--note-orit-bg)}
.note-box.masoretic{border-left-color:var(--note-maso);background:var(--note-maso-bg)}
.note-box.critical{border-left-color:var(--note-crit);background:var(--note-crit-bg)}
.note-box.gold{border-left-color:var(--note-maso);background:var(--note-maso-bg)}
.note-label{font-family:Arial,sans-serif;font-size:.71rem;font-weight:bold;margin-bottom:4px}
.note-box.dss .note-label{color:var(--note-dss)}
.note-box.orit .note-label{color:var(--note-orit)}
.note-box.masoretic .note-label{color:var(--note-maso)}
.note-box.critical .note-label{color:var(--note-crit)}
.note-box.gold .note-label{color:var(--note-maso)}
.note-text{font-family:Arial,sans-serif;font-size:.78rem;font-style:italic;color:var(--text2);line-height:1.6;padding-left:8px}
.fact-box{margin:11px 0;padding:10px 13px;background:var(--fact-bg);border-left:4px solid var(--fact-border);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2)}
.fact-box .para{font-weight:bold;color:var(--text);margin-bottom:0}

/* HIGHLIGHTS */
.hl-y{background:var(--highlight-y);border-radius:2px}
.hl-g{background:var(--highlight-g);border-radius:2px}
.hl-b{background:var(--highlight-b);border-radius:2px}
.hl-p{background:var(--highlight-p);border-radius:2px}
.hl-o{background:var(--highlight-o);border-radius:2px}

/* CHAPTER NAV */
.ch-nav{display:flex;gap:9px;margin-top:40px;padding-top:16px;border-top:1px solid var(--border)}
.nav-btn{flex:1;padding:8px 10px;border:1px solid var(--btn-border);border-radius:4px;background:var(--bg2);cursor:pointer;font-family:Arial,sans-serif;font-size:.76rem;color:var(--text2);text-align:center;transition:all .2s;line-height:1.3}
.nav-btn:hover{background:var(--btn-hover);border-color:var(--accent2);color:var(--text)}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn small{display:block;font-size:.66rem;color:var(--text3);margin-bottom:1px}

/* SEARCH RESULTS */
.search-results{max-width:740px;margin:0 auto;padding:26px 22px 60px}
.search-results h2{font-size:.95rem;font-weight:bold;color:var(--text);margin-bottom:12px}
.result-item{padding:10px 11px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;cursor:pointer;background:var(--bg2);transition:all .2s}
.result-item:hover{background:var(--btn-hover);border-color:var(--accent2)}
.result-vol{font-size:.65rem;font-weight:bold;color:var(--text3);margin-bottom:2px}
.result-title{font-size:.82rem;font-weight:bold;color:var(--text);margin-bottom:3px}
.result-snip{font-size:.73rem;color:var(--text2);line-height:1.4}
mark{background:var(--search-hl);color:var(--text);border-radius:2px;padding:0 1px}

/* === READING BAR === */
.reading-bar{position:fixed;bottom:0;left:0;right:0;background:var(--reading-bar-bg);border-top:1px solid var(--reading-bar-border);padding:7px 11px;display:none;align-items:center;gap:5px;z-index:150;flex-wrap:wrap}
.reading-bar.visible{display:flex}
.read-btn{background:none;border:1px solid #555555;border-radius:4px;cursor:pointer;color:#CCCCCC;padding:5px 10px;font-family:Arial,sans-serif;font-size:.73rem;transition:all .2s;white-space:nowrap}
.read-btn:hover,.read-btn.on{background:#444444;color:#FFFFFF;border-color:#777777}
select.read-ctl{background:#333333;border:1px solid #555555;color:#CCCCCC;border-radius:4px;padding:4px 6px;font-family:Arial,sans-serif;font-size:.71rem;max-width:160px}
.read-lbl{font-size:.68rem;color:#888888;white-space:nowrap}
.font-ctrl{display:flex;gap:3px}
.font-btn{background:none;border:1px solid #555555;border-radius:4px;cursor:pointer;color:#CCCCCC;padding:4px 8px;font-size:.76rem;transition:all .2s}
.font-btn:hover{background:#444444;color:#FFFFFF}

/* HIGHLIGHT TOOLBAR */
#hlBar{position:fixed;z-index:300;background:var(--modal-inner);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;display:none;align-items:center;gap:5px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#hlBar.visible{display:flex}
.hl-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.hl-dot:hover{border-color:var(--text2)}
.hl-copy{background:none;border:1px solid var(--border2);border-radius:3px;padding:3px 7px;font-size:.68rem;cursor:pointer;color:var(--text2);transition:all .2s;white-space:nowrap}
.hl-copy:hover{background:var(--btn-hover)}
.hl-remove{background:none;border:1px solid var(--border2);border-radius:3px;padding:3px 5px;font-size:.7rem;cursor:pointer;color:var(--text3)}

/* NOTES PANEL */
#notesPanel{position:fixed;right:0;top:52px;bottom:0;width:300px;background:var(--bg2);border-left:1px solid var(--border2);z-index:190;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
#notesPanel.open{transform:translateX(0)}
.notes-hdr{padding:11px 12px;border-bottom:1px solid var(--border);font-size:.78rem;font-weight:bold;color:var(--text);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.notes-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:1rem;padding:2px 6px}
#notesTextarea{flex:1;border:none;outline:none;padding:12px;background:var(--bg2);color:var(--text);font-family:Arial,sans-serif;font-size:.82rem;line-height:1.6;resize:none}
.notes-saved{font-size:.66rem;color:var(--text3);padding:4px 12px;border-top:1px solid var(--border);flex-shrink:0}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:var(--modal-bg);z-index:500;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--modal-inner);border:1px solid var(--border2);border-radius:8px;padding:22px;max-width:360px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:.92rem;font-weight:bold;color:var(--text);margin-bottom:14px}
.modal-input{width:100%;padding:8px 10px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text);font-family:Arial,sans-serif;font-size:.84rem;outline:none;margin-bottom:10px}
.modal-btn{padding:7px 18px;border:none;border-radius:4px;background:var(--accent2);color:#FFFFFF;font-family:Arial,sans-serif;font-size:.8rem;cursor:pointer;margin-right:6px;transition:background .2s}
.modal-btn:hover{opacity:.85}
.modal-cancel{background:none;border:1px solid var(--btn-border);color:var(--text2)}
.modal-list{list-style:none}
.modal-list li{padding:8px 10px;border:1px solid var(--border);border-radius:4px;margin-bottom:5px;cursor:pointer;background:var(--bg2);transition:all .2s;font-size:.8rem;color:var(--text)}
.modal-list li:hover{background:var(--btn-hover)}
.modal-list li small{display:block;color:var(--text3);font-size:.68rem;margin-top:2px}
.modal-empty{color:var(--text3);font-size:.78rem;font-style:italic;text-align:center;padding:16px 0}

/* VOICE PREVIEW */
#previewBtn{font-size:.72rem}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.overlay.visible{display:block}

/* LINE SPACING RANGE */
.ls-ctrl{display:flex;align-items:center;gap:4px}
.ls-btn{background:none;border:1px solid #555555;border-radius:4px;cursor:pointer;color:#CCCCCC;padding:4px 8px;font-size:.78rem;line-height:1}
.ls-btn:hover{background:#444444}

@media(max-width:700px){
  .sidebar{width:100%;max-width:300px}
  .main{margin-left:0}
  .chapter-view,.welcome,.search-results{padding:16px 13px 80px}
  #notesPanel{width:100%;top:52px}
  .reading-bar{padding:5px 8px}
}
@media print{.hdr,.sidebar,.reading-bar,.progress-bar,.ch-nav,#scrollTopBtn,#hlBar,#notesPanel{display:none!important}.main{margin-left:0}}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-logo">The Great Eraser</div>
  <div class="lock-sub">A Complete Research Record — Enter access code</div>
  <input class="lock-input" id="lockInput" type="password" placeholder="Password" autocomplete="off" maxlength="32"/>
  <button class="lock-btn" onclick="checkPass()">Unlock</button>
  <div class="lock-err" id="lockErr"></div>
</div>

<!-- PROGRESS -->
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<!-- HEADER -->
<header class="hdr" id="appHdr" style="display:none">
  <button class="hdr-menu" onclick="toggleSidebar()">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="currentColor"><rect y="3" width="20" height="2" rx="1"/><rect y="9" width="20" height="2" rx="1"/><rect y="15" width="20" height="2" rx="1"/></svg>
  </button>
  <div class="hdr-title" id="hdrTitle">The Great Eraser <span class="pos"></span></div>
  <div class="hdr-actions">
    <button class="icon-btn" title="Chapter jump" onclick="openChapterJump()"><span class="ic">⌨</span></button>
    <button class="icon-btn" title="Recently read" onclick="openRecent()"><span class="ic">🕐</span></button>
    <button class="icon-btn" title="Bookmarks" onclick="openBookmarks()"><span class="ic">★</span></button>
    <button class="icon-btn" title="Bookmark this section" onclick="bookmarkCurrent()"><span class="ic">🔖</span></button>
    <button class="icon-btn" title="Notes" onclick="toggleNotes()"><span class="ic">📝</span></button>
    <button class="icon-btn" title="All notes" onclick="openAllNotes()"><span class="ic">📄</span></button>
    <button class="icon-btn" title="Reading panel" onclick="toggleReadingBar()"><span class="ic">▶</span></button>
    <button class="icon-btn" id="darkBtn" title="Dark mode" onclick="cycleModes()"><span class="ic">🌙</span></button>
    <button class="icon-btn" id="readModeBtn" title="Reading mode" onclick="toggleReadingMode()"><span class="ic">📖</span></button>
    <button class="icon-btn" title="Search" onclick="focusSearch()"><span class="ic">🔍</span></button>
  </div>
</header>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- LAYOUT -->
<div class="layout" id="appLayout" style="display:none">
  <nav class="sidebar" id="sidebar">
    <div class="sb-hdr">
      <h2>The Great Eraser · 8 Volumes · 111 Chapters</h2>
      <div class="sb-tools">
        <button class="sb-btn" onclick="openChapterJump()">⌨ Jump to CH</button>
        <button class="sb-btn" onclick="openRecent()">🕐 Recent</button>
        <button class="sb-btn" onclick="openBookmarks()">★ Bookmarks</button>
      </div>
    </div>
    <div class="sb-search-wrap">
      <input class="sb-search" id="sidebarSearch" type="search" placeholder="Search all volumes…" oninput="handleSearch(this.value)" autocomplete="off"/>
    </div>
    <div class="vol-list" id="volList"></div>
  </nav>

  <main class="main" id="main">
    <div id="contentArea"></div>
  </main>
</div>

<!-- SCROLL TO TOP -->
<button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Scroll to top">↑</button>

<!-- HIGHLIGHT TOOLBAR -->
<div id="hlBar">
  <div class="hl-dot" style="background:var(--highlight-y)" title="Yellow" onclick="applyHL('hl-y')"></div>
  <div class="hl-dot" style="background:var(--highlight-g)" title="Green" onclick="applyHL('hl-g')"></div>
  <div class="hl-dot" style="background:var(--highlight-b)" title="Blue" onclick="applyHL('hl-b')"></div>
  <div class="hl-dot" style="background:var(--highlight-p)" title="Purple" onclick="applyHL('hl-p')"></div>
  <div class="hl-dot" style="background:var(--highlight-o)" title="Orange" onclick="applyHL('hl-o')"></div>
  <button class="hl-copy" onclick="copySelection()">Copy</button>
  <button class="hl-remove" onclick="removeHL()" title="Remove highlight">✕</button>
</div>

<!-- NOTES PANEL -->
<div id="notesPanel">
  <div class="notes-hdr">
    <span id="notesPanelTitle">Section Notes</span>
    <button class="notes-close" onclick="toggleNotes()">✕</button>
  </div>
  <textarea id="notesTextarea" placeholder="Your notes for this section… auto-saved." oninput="saveNote()"></textarea>
  <div class="notes-saved" id="notesSaved"></div>
</div>

<!-- READING BAR -->
<div class="reading-bar" id="readingBar">
  <button class="read-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
  <button class="read-btn" id="pauseBtn" onclick="pauseRead()" style="display:none">⏸ Pause</button>
  <button class="read-btn" onclick="stopRead()">■ Stop</button>
  <span class="read-lbl">Mode</span>
  <select class="read-ctl" id="readMode">
    <option value="all">All text</option>
    <option value="verses">Verses only</option>
    <option value="notes">Notes only</option>
  </select>
  <span class="read-lbl">Speed</span>
  <select class="read-ctl" id="readSpeed" onchange="saveSettings()">
    <option value="0.7">0.7×</option>
    <option value="0.85">0.85×</option>
    <option value="1" selected>1×</option>
    <option value="1.2">1.2×</option>
    <option value="1.5">1.5×</option>
  </select>
  <select class="read-ctl" id="voiceSelect" style="max-width:155px"></select>
  <button class="read-btn" id="previewBtn" onclick="previewVoice()">Preview</button>
  <span class="read-lbl">Lines</span>
  <div class="ls-ctrl">
    <button class="ls-btn" onclick="changeLineSpacing(-0.1)">−</button>
    <button class="ls-btn" onclick="changeLineSpacing(0.1)">+</button>
  </div>
  <div class="font-ctrl">
    <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
    <button class="font-btn" onclick="changeFontSize(1)">A+</button>
  </div>
</div>

<!-- CHAPTER JUMP MODAL -->
<div class="modal-overlay" id="jumpModal">
  <div class="modal">
    <h3>Jump to Chapter</h3>
    <input class="modal-input" id="jumpInput" type="number" min="1" max="111" placeholder="Enter chapter number (1–111)" onkeydown="if(event.key==='Enter')doJump()"/>
    <button class="modal-btn" onclick="doJump()">Go</button>
    <button class="modal-btn modal-cancel" onclick="closeModal('jumpModal')">Cancel</button>
  </div>
</div>

<!-- RECENT MODAL -->
<div class="modal-overlay" id="recentModal">
  <div class="modal">
    <h3>🕐 Recently Read</h3>
    <ul class="modal-list" id="recentList"></ul>
    <button class="modal-btn modal-cancel" onclick="closeModal('recentModal')" style="margin-top:8px">Close</button>
  </div>
</div>

<!-- BOOKMARKS MODAL -->
<div class="modal-overlay" id="bookmarksModal">
  <div class="modal">
    <h3>★ Bookmarks</h3>
    <ul class="modal-list" id="bookmarkList"></ul>
    <button class="modal-btn modal-cancel" onclick="closeModal('bookmarksModal')" style="margin-top:8px">Close</button>
  </div>
</div>

<!-- ALL NOTES MODAL -->
<div class="modal-overlay" id="allNotesModal">
  <div class="modal" style="max-width:460px">
    <h3>📄 All Notes</h3>
    <ul class="modal-list" id="allNotesList"></ul>
    <button class="modal-btn modal-cancel" onclick="closeModal('allNotesModal')" style="margin-top:8px">Close</button>
  </div>
</div>

<script>
'use strict';
// ── PASSWORD ──
const PASS_HASH='025fac462cabe923b455dcac513ab01478862bf0b948ecf2a42d9a7a09a6b8b8';
async function sha256(s){const d=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function checkPass(){
  const v=document.getElementById('lockInput').value;
  const h=await sha256(v);
  if(h===PASS_HASH){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('appHdr').style.display='flex';
    document.getElementById('appLayout').style.display='flex';
    initApp();
  } else {
    const e=document.getElementById('lockErr');
    e.textContent='Incorrect password.';
    document.getElementById('lockInput').value='';
    setTimeout(()=>e.textContent='',2500);
  }
}
document.getElementById('lockInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPass();});

// ── VOL META ──
const VOL_META=[
  {num:1,name:'VOLUME ONE',desc:'Geographic Truth · Ancient People · Primary Text Framework'},
  {num:2,name:'VOLUME TWO',desc:'African Civilizations · Systematic Erasure — Five Mechanisms'},
  {num:3,name:'VOLUME THREE',desc:'Atrocity Record · Covenant Predictive Framework'},
  {num:4,name:'VOLUME FOUR',desc:'Pre-Biblical Foundations · Cultural Fingerprints · DNA Suppression'},
  {num:5,name:'VOLUME FIVE',desc:'Shir HaShirim 1:5-6 · Racial Erasure — Ancient to Present'},
  {num:6,name:'VOLUME SIX',desc:'Middle East / Israel as Modern Constructions · Text Suppression'},
  {num:7,name:'VOLUME SEVEN',desc:'The Created Christ · Khazar Identity · Twelve Tribes'},
  {num:8,name:'VOLUME EIGHT',desc:'Architecture of Control · The Wall of Fire · ACS Cross-References'},
];

let volumes={},currentVol=null,currentChIdx=0,totalChapters=111;
let sidebarOpen=true,readingBarOpen=false,readingMode=false,notesPanelOpen=false;
let fontAdj=0,lineSpacing=1.7,themeMode='light';
let synth=window.speechSynthesis,utterance=null,reading=false,paused=false,voices=[];
let readPosKey=null,saveScrollTimer=null,hlSelection=null;
let noteSaveTimer=null;
let chapterIndex=[];// flat list [{volNum,chIdx,ch}]

function initApp(){
  loadSettings();
  buildSidebar();
  loadVoices();
  window.addEventListener('scroll',onScroll);
  document.addEventListener('mouseup',onMouseUp);
  document.addEventListener('touchend',onMouseUp);
  document.addEventListener('keydown',onKey);
  restoreLastSession();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── SETTINGS ──
function loadSettings(){
  const s=JSON.parse(localStorage.getItem('ge_settings')||'{}');
  fontAdj=s.fontAdj||0; lineSpacing=s.lineSpacing||1.7; themeMode=s.themeMode||'light';
  document.body.style.fontSize=(14+fontAdj)+'px';
  document.querySelector('.content-body,.para,body').style&&null;
  setTheme(themeMode);
  const sp=document.getElementById('readSpeed'); if(s.readSpeed) sp.value=s.readSpeed;
  const rm=document.getElementById('readMode'); if(s.readMode) rm.value=s.readMode;
}
function saveSettings(){
  const s={fontAdj,lineSpacing,themeMode,readSpeed:document.getElementById('readSpeed').value,readMode:document.getElementById('readMode').value};
  localStorage.setItem('ge_settings',JSON.stringify(s));
}
function setTheme(mode){
  themeMode=mode;
  document.body.classList.remove('dark','sepia');
  if(mode==='dark') document.body.classList.add('dark');
  if(mode==='sepia') document.body.classList.add('sepia');
  const btn=document.getElementById('darkBtn');
  btn.querySelector('.ic').textContent=mode==='dark'?'☀':mode==='sepia'?'🌙':'🌙';
  saveSettings();
}
function cycleModes(){
  const next={light:'sepia',sepia:'dark',dark:'light'};
  setTheme(next[themeMode]||'light');
}

// ── VOICES ──
function loadVoices(){
  const load=()=>{
    voices=synth.getVoices();
    const sel=document.getElementById('voiceSelect');
    sel.innerHTML='';
    voices.forEach((v,i)=>{
      const o=document.createElement('option');
      o.value=i;
      const enhanced=v.name.includes('Enhanced')||v.name.includes('Neural')||v.name.includes('Premium');
      o.textContent=(enhanced?'★ ':'')+v.name+(v.localService?'':' ♦');
      if(v.name.includes('Samantha')||v.name.includes('Ava')||v.name.includes('Karen')) o.selected=true;
      sel.appendChild(o);
    });
  };
  if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=load;
  load();
}

// ── SIDEBAR ──
function buildSidebar(){
  const list=document.getElementById('volList');
  list.innerHTML='';
  VOL_META.forEach(vm=>{
    const item=document.createElement('div');
    item.className='vol-item';
    item.innerHTML=`<button class="vol-btn" id="vbtn${vm.num}" onclick="toggleVol(${vm.num})">
      <span class="v-num">VOL ${vm.num}</span>
      <span class="v-txt"><div class="v-name">${vm.name}</div><div class="v-desc">${vm.desc}</div></span>
      <span class="v-arrow">›</span></button>
      <div class="ch-list" id="chlist${vm.num}"></div>`;
    list.appendChild(item);
  });
}
function toggleVol(num){
  const cl=document.getElementById('chlist'+num),btn=document.getElementById('vbtn'+num);
  const was=cl.classList.contains('open');
  document.querySelectorAll('.ch-list.open').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.vol-btn.open').forEach(e=>e.classList.remove('open'));
  if(!was){btn.classList.add('open');cl.classList.add('open');loadVolSidebar(num,cl);}
}
async function loadVolSidebar(num,container){
  if(container.dataset.loaded) return;
  container.dataset.loaded='1';
  const vol=await getVol(num); if(!vol) return;
  container.innerHTML=vol.chapters.map((ch,i)=>
    `<button class="ch-btn" id="chbtn${num}_${i}" onclick="loadChapter(${num},${i})">CH.${ch.num} — ${ch.title}</button>`
  ).join('');
}
function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').classList.toggle('hidden',!sidebarOpen);
  document.getElementById('main').classList.toggle('full',!sidebarOpen);
  if(window.innerWidth<=700) document.getElementById('overlay').classList.toggle('visible',sidebarOpen);
}
function closeSidebar(){
  sidebarOpen=false;
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('main').classList.add('full');
  document.getElementById('overlay').classList.remove('visible');
}

// ── DATA ──
async function getVol(num){
  if(volumes[num]) return volumes[num];
  try{const r=await fetch(`data/vol${num}.json`);if(!r.ok)throw 0;volumes[num]=await r.json();buildIndex(num);return volumes[num];}catch(e){return null;}
}
function buildIndex(num){
  const vol=volumes[num]; if(!vol) return;
  vol.chapters.forEach((ch,i)=>{
    chapterIndex.push({volNum:num,chIdx:i,ch,chNum:ch.num});
  });
  chapterIndex.sort((a,b)=>a.chNum-b.chNum);
  totalChapters=chapterIndex.length||111;
}

// ── WELCOME ──
function showWelcome(){
  document.getElementById('hdrTitle').innerHTML='The Great Eraser <span class="pos"></span>';
  document.getElementById('contentArea').innerHTML=`<div class="welcome">
    <div class="ch-vol-label">DSS · Ge'ez Orit · Peer-Reviewed Record · Primary Documentation</div>
    <h1 class="welcome-title">The Great Eraser</h1>
    <p class="welcome-sub">A Complete Research Record — Eight Volumes · 111 Chapters. Ancient African Hebrew Identity · Racial Erasure · Architecture of Control · The Wall of Fire · ACS Cross-References</p>
    <hr class="welcome-divider"/>
    <p class="welcome-meta"><strong>Primary Authority:</strong> Dead Sea Scrolls · Ge'ez Orit · Ugaritic Record · Peer-Reviewed Genetics · Primary Historical Documentation</p>
    <p class="welcome-excl">Excluding: New Testament · Rabbinic Talmud · Western Eurocentric Framing · Masoretic Text (10th c. CE)</p>
    <div class="vol-cards">${VOL_META.map(vm=>`<div class="vol-card" onclick="openVol(${vm.num})">
      <div class="vc-num">VOLUME ${vm.num}</div>
      <div class="vc-name">${vm.name}</div>
      <div class="vc-desc">${vm.desc}</div></div>`).join('')}</div></div>`;
}

async function openVol(num){
  const vol=await getVol(num); if(!vol) return;
  toggleVol(num); await loadChapter(num,0);
}

// ── CHAPTER LOAD ──
async function loadChapter(volNum,chIdx){
  stopRead();
  const vol=await getVol(volNum); if(!vol) return;
  const ch=vol.chapters[chIdx]; if(!ch) return;
  currentVol=volNum; currentChIdx=chIdx;
  readPosKey=`ge_pos_${volNum}_${chIdx}`;

  // Sidebar active
  document.querySelectorAll('.ch-btn.active').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.vol-btn.active').forEach(b=>b.classList.remove('active'));
  const cb=document.getElementById(`chbtn${volNum}_${chIdx}`);
  if(cb){cb.classList.add('active');cb.scrollIntoView({block:'nearest'});}
  const vb=document.getElementById('vbtn'+volNum); if(vb) vb.classList.add('active');

  // Position count
  const flatIdx=chapterIndex.findIndex(x=>x.volNum===volNum&&x.chIdx===chIdx);
  const posStr=flatIdx>=0?`(${flatIdx+1} of ${totalChapters})`:'';

  document.getElementById('hdrTitle').innerHTML=
    `<span style="font-size:.72rem;font-weight:normal;color:var(--header-sub)">Vol ${volNum} · </span>CH.${ch.num} — ${ch.title.slice(0,48)}${ch.title.length>48?'…':''} <span class="pos">${posStr}</span>`;

  document.getElementById('contentArea').innerHTML=renderChapter(vol,ch,volNum,chIdx,flatIdx);
  
  // Restore highlights
  setTimeout(()=>restoreHighlights(volNum,chIdx),100);
  
  // Notes
  loadNote(volNum,chIdx);
  if(notesPanelOpen){
    document.getElementById('notesPanelTitle').textContent=`Notes — CH.${ch.num}`;
  }

  // Restore scroll position
  const savedScroll=parseInt(localStorage.getItem(readPosKey)||'0');
  window.scrollTo({top:savedScroll,behavior:'instant'});
  updateProgress();

  // Save to recent & last session
  addRecent(volNum,chIdx,ch);
  localStorage.setItem('ge_last',''+volNum+','+chIdx);

  if(window.innerWidth<=700) closeSidebar();
}

function renderChapter(vol,ch,volNum,chIdx,flatIdx){
  const vm=VOL_META.find(v=>v.num===volNum);
  let body='';
  (ch.content||[]).forEach(b=>{
    switch(b.type){
      case 'part': body+=`<div class="part-banner">${esc(b.text)}</div>`; break;
      case 'section':
        const isX=b.heading&&b.heading.includes('Cross-Reference');
        body+=isX?`<div class="xref-hdr">⊕ ${esc(b.heading)}</div>`:`<div class="section-banner">${esc(b.heading)}</div>`;
        (b.paragraphs||[]).forEach(p=>body+=`<p class="para">${esc(p)}</p>`); break;
      case 'body': body+=`<p class="para">${esc(b.text)}</p>`; break;
      case 'bullet': body+=`<div class="bullet-item">${esc(b.text)}</div>`; break;
      case 'source': body+=`<div class="source-line">${esc(b.text)}</div>`; break;
      case 'fact': body+=`<div class="fact-box"><p class="para">${esc(b.text)}</p></div>`; break;
      case 'note':
        const nt=b.note_type||'dss';
        const cls={dss:'dss',orit:'orit',critical:'critical',masoretic:'masoretic',gold:'gold'}[nt]||'dss';
        body+=`<div class="note-box ${cls}"><div class="note-label">[${esc(b.label||nt.toUpperCase())}]</div><div class="note-text">${esc(b.text)}</div></div>`; break;
    }
  });
  const fi=flatIdx>=0?flatIdx:0;
  const prev=fi>0?`<button class="nav-btn" onclick="loadFlat(${fi-1})"><small>← Previous</small>${chapterIndex[fi-1]?'CH.'+chapterIndex[fi-1].chNum:''}</button>`:`<button class="nav-btn" disabled><small>Start</small>Beginning</button>`;
  const next=fi<chapterIndex.length-1?`<button class="nav-btn" onclick="loadFlat(${fi+1})"><small>Next →</small>${chapterIndex[fi+1]?'CH.'+chapterIndex[fi+1].chNum:''}</button>`:`<button class="nav-btn" disabled><small>End</small>Complete</button>`;
  const lineS=`style="line-height:${lineSpacing}"`;
  return `<div class="chapter-view">
    <div class="ch-hdr">
      <div class="ch-vol-label">${vm?vm.name:'VOL '+volNum} — Chapter ${fi>=0?fi+1:'?'} of ${totalChapters}</div>
      <div class="ch-number">Chapter ${ch.num}</div>
      <div class="ch-title">${esc(ch.title)}</div>
    </div>
    <div class="content-body" id="chapterBody" ${lineS}>${body}</div>
    <nav class="ch-nav">${prev}${next}</nav></div>`;
}

async function loadFlat(fi){
  if(!chapterIndex[fi]) return;
  const {volNum,chIdx}=chapterIndex[fi];
  const vol=await getVol(volNum);
  if(!vol) return;
  toggleVol(volNum);
  await loadVolSidebar(volNum,document.getElementById('chlist'+volNum));
  await loadChapter(volNum,chIdx);
}

// ── RESTORE SESSION ──
async function restoreLastSession(){
  const last=localStorage.getItem('ge_last');
  if(last){
    const [v,c]=last.split(',').map(Number);
    const vol=await getVol(v); if(!vol) return;
    toggleVol(v);
    await loadVolSidebar(v,document.getElementById('chlist'+v));
    await loadChapter(v,c);
  } else { showWelcome(); }
}

// ── SCROLL & PROGRESS ──
function onScroll(){
  updateProgress();
  const st=window.scrollY;
  // Scroll to top button
  document.getElementById('scrollTopBtn').classList.toggle('visible',st>300);
  // Auto-save position
  if(readPosKey){
    clearTimeout(saveScrollTimer);
    saveScrollTimer=setTimeout(()=>localStorage.setItem(readPosKey,''+Math.round(st)),3000);
  }
}
function updateProgress(){
  const d=document.documentElement,st=d.scrollTop||document.body.scrollTop,sh=d.scrollHeight-d.clientHeight;
  document.getElementById('progressFill').style.width=sh>0?((st/sh)*100)+'%':'0%';
}

// ── SEARCH ──
function focusSearch(){
  document.getElementById('sidebarSearch').focus();
  if(window.innerWidth<=700&&!sidebarOpen) toggleSidebar();
}
let searchTimer;
function handleSearch(q){
  clearTimeout(searchTimer);
  if(!q||q.length<2){return;}
  searchTimer=setTimeout(()=>doSearch(q),350);
}
async function doSearch(q){
  const results=[],ql=q.toLowerCase();
  for(let n=1;n<=8;n++){
    const vol=await getVol(n); if(!vol) continue;
    vol.chapters.forEach((ch,idx)=>{
      let found=ch.title.toLowerCase().includes(ql),snippet='';
      (ch.content||[]).forEach(b=>{
        const txt=b.text||b.heading||'';
        if(txt.toLowerCase().includes(ql)){found=true;if(!snippet){const p=txt.toLowerCase().indexOf(ql);snippet=txt.slice(Math.max(0,p-60),p+100);}}
        (b.paragraphs||[]).forEach(p=>{if(p.toLowerCase().includes(ql)){found=true;if(!snippet)snippet=p.slice(0,130);}});
      });
      if(found) results.push({volNum:n,idx,ch,snippet});
    });
  }
  const hi=t=>t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${esc(m)}</mark>`);
  document.getElementById('contentArea').innerHTML=`<div class="search-results">
    <h2>Results for "${esc(q)}" — ${results.length} found</h2>
    ${results.slice(0,60).map(r=>`<div class="result-item" onclick="loadChapter(${r.volNum},${r.idx})">
      <div class="result-vol">VOLUME ${r.volNum} · CH.${r.ch.num}</div>
      <div class="result-title">${hi(esc(r.ch.title))}</div>
      ${r.snippet?`<div class="result-snip">${hi(esc(r.snippet))}…</div>`:''}</div>`).join('')}
    ${results.length===0?'<div class="modal-empty">No results found.</div>':''}</div>`;
}

// ── CHAPTER JUMP ──
function openChapterJump(){
  document.getElementById('jumpModal').classList.add('open');
  document.getElementById('jumpInput').value='';
  document.getElementById('jumpInput').focus();
}
async function doJump(){
  const n=parseInt(document.getElementById('jumpInput').value);
  if(!n||n<1||n>111){return;}
  closeModal('jumpModal');
  // Find chapter by number across all volumes
  for(let v=1;v<=8;v++){
    const vol=await getVol(v); if(!vol) continue;
    const idx=vol.chapters.findIndex(c=>c.num===n);
    if(idx>=0){ toggleVol(v); await loadVolSidebar(v,document.getElementById('chlist'+v)); await loadChapter(v,idx); return;}
  }
}

// ── RECENTLY READ ──
function addRecent(volNum,chIdx,ch){
  let r=JSON.parse(localStorage.getItem('ge_recent')||'[]');
  r=r.filter(x=>!(x.v===volNum&&x.c===chIdx));
  r.unshift({v:volNum,c:chIdx,num:ch.num,title:ch.title,ts:Date.now()});
  if(r.length>10) r=r.slice(0,10);
  localStorage.setItem('ge_recent',JSON.stringify(r));
}
function openRecent(){
  const r=JSON.parse(localStorage.getItem('ge_recent')||'[]');
  const list=document.getElementById('recentList');
  list.innerHTML=r.length?r.map(x=>`<li onclick="loadChapter(${x.v},${x.c});closeModal('recentModal')">CH.${x.num} — ${esc(x.title)}<small>Vol ${x.v}</small></li>`).join(''):'<li class="modal-empty" style="cursor:default">No recent sections</li>';
  document.getElementById('recentModal').classList.add('open');
}

// ── BOOKMARKS ──
function bookmarkCurrent(){
  if(currentVol===null) return;
  const vol=volumes[currentVol]; if(!vol) return;
  const ch=vol.chapters[currentChIdx]; if(!ch) return;
  let bm=JSON.parse(localStorage.getItem('ge_bookmarks')||'[]');
  const key=`${currentVol}_${currentChIdx}`;
  if(bm.find(x=>x.key===key)){
    bm=bm.filter(x=>x.key!==key);
    showToast('Bookmark removed');
  } else {
    bm.unshift({key,v:currentVol,c:currentChIdx,num:ch.num,title:ch.title,ts:Date.now()});
    showToast('Bookmarked ★');
  }
  localStorage.setItem('ge_bookmarks',JSON.stringify(bm));
}
function openBookmarks(){
  const bm=JSON.parse(localStorage.getItem('ge_bookmarks')||'[]');
  const list=document.getElementById('bookmarkList');
  list.innerHTML=bm.length?bm.map(x=>`<li onclick="loadChapter(${x.v},${x.c});closeModal('bookmarksModal')">CH.${x.num} — ${esc(x.title)}<small>Vol ${x.v}</small></li>`).join(''):'<div class="modal-empty">No bookmarks yet</div>';
  document.getElementById('bookmarksModal').classList.add('open');
}

// ── NOTES ──
function loadNote(volNum,chIdx){
  const key=`ge_note_${volNum}_${chIdx}`;
  const ta=document.getElementById('notesTextarea');
  ta.value=localStorage.getItem(key)||'';
  document.getElementById('notesSaved').textContent='';
}
function saveNote(){
  if(currentVol===null) return;
  const key=`ge_note_${currentVol}_${currentChIdx}`;
  clearTimeout(noteSaveTimer);
  noteSaveTimer=setTimeout(()=>{
    localStorage.setItem(key,document.getElementById('notesTextarea').value);
    const s=document.getElementById('notesSaved');
    s.textContent='Saved';
    setTimeout(()=>s.textContent='',1500);
  },800);
}
function toggleNotes(){
  notesPanelOpen=!notesPanelOpen;
  document.getElementById('notesPanel').classList.toggle('open',notesPanelOpen);
  if(notesPanelOpen&&currentVol!==null){
    const ch=volumes[currentVol]?.chapters[currentChIdx];
    document.getElementById('notesPanelTitle').textContent=ch?`Notes — CH.${ch.num}`:'Section Notes';
  }
}
function openAllNotes(){
  const list=document.getElementById('allNotesList');
  let items='';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k.startsWith('ge_note_')) continue;
    const val=localStorage.getItem(k);
    if(!val||!val.trim()) continue;
    const [,v,c]=k.split('_').map((x,i)=>i>1?Number(x):x);
    const vol=volumes[v];
    const ch=vol?.chapters[c];
    const title=ch?`CH.${ch.num} — ${ch.title}`:`Vol ${v} Ch ${c}`;
    items+=`<li onclick="loadChapter(${v},${c});closeModal('allNotesModal')">${esc(title)}<small>${esc(val.slice(0,80))}…</small></li>`;
  }
  list.innerHTML=items||'<div class="modal-empty">No notes yet</div>';
  document.getElementById('allNotesModal').classList.add('open');
}

// ── HIGHLIGHTS ──
let currentHL=null;
function onMouseUp(e){
  if(e.target.closest('#hlBar')||e.target.closest('.reading-bar')||e.target.closest('.modal')) return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.toString().trim()){
    setTimeout(()=>{if(!window.getSelection()||window.getSelection().isCollapsed) hideHLBar();},150);
    return;
  }
  if(!sel.anchorNode||!document.getElementById('chapterBody')?.contains(sel.anchorNode)) return;
  hlSelection=sel.getRangeAt(0).cloneRange();
  const rect=sel.getRangeAt(0).getBoundingClientRect();
  showHLBar(rect.left+rect.width/2,rect.top+window.scrollY-48);
}
function showHLBar(x,y){
  const bar=document.getElementById('hlBar');
  bar.classList.add('visible');
  bar.style.left=Math.min(Math.max(4,x-100),window.innerWidth-220)+'px';
  bar.style.top=Math.max(60,y)+'px';
}
function hideHLBar(){document.getElementById('hlBar').classList.remove('visible');currentHL=null;}
function applyHL(cls){
  if(!hlSelection) return;
  const span=document.createElement('span');
  span.className=cls;
  try{
    hlSelection.surroundContents(span);
    saveHighlights();
  }catch(e){}
  window.getSelection()?.removeAllRanges();
  hideHLBar();
}
function copySelection(){
  if(!hlSelection) return;
  const txt=hlSelection.toString();
  navigator.clipboard.writeText(txt).catch(()=>{});
  showToast('Copied');
  hideHLBar();
}
function removeHL(){
  if(!hlSelection) return;
  const node=hlSelection.commonAncestorContainer;
  const span=node.nodeType===3?node.parentElement:node;
  if(span&&/^hl-/.test(span.className)){
    const parent=span.parentNode;
    while(span.firstChild) parent.insertBefore(span.firstChild,span);
    parent.removeChild(span);
    saveHighlights();
  }
  hideHLBar();
}
function saveHighlights(){
  if(currentVol===null) return;
  const body=document.getElementById('chapterBody');
  if(!body) return;
  localStorage.setItem(`ge_hl_${currentVol}_${currentChIdx}`,body.innerHTML);
}
function restoreHighlights(v,c){
  const saved=localStorage.getItem(`ge_hl_${v}_${c}`);
  if(!saved) return;
  const body=document.getElementById('chapterBody');
  if(body) body.innerHTML=saved;
}

// ── VOICE READING ──
function pronunciationFix(text){
  return text
    .replace(/\ud802[\udd00-\udd1f]/g,'')// Paleo-Hebrew silent
    .replace(/[\u10840-\u1085F]/g,'')     // Paleo-Hebrew block
    .replace(/𐤉𐤄𐤅𐤄/g,'Yahweh')
    .replace(/\[DSS CROSS-REF[^\]]*\]/g,'Dead Sea Scrolls note:')
    .replace(/\[ORIT GE'EZ CROSS-REF[^\]]*\]/g,'Orit Gezz note:')
    .replace(/\[DSS\]/g,'Dead Sea Scrolls note:')
    .replace(/\[ORIT GE'EZ\]/g,'Orit Gezz note:')
    .replace(/\[MASORETIC VARIANT\]/g,'Masoretic variant note:')
    .replace(/\[CRITICAL NOTE[^\]]*\]/g,'Critical note:')
    .replace(/\bYHWH\b/g,'Yahweh')
    .replace(/\bYH\b/g,'Yah')
    .replace(/\bMosheh\b/g,'Mo-sheh')
    .replace(/\bYehoshua\b/g,'Yeh-ho-shua')
    .replace(/\bChanokh\b/g,'Khha-nokh')
    .replace(/\bQumran\b/g,'Koom-rahn')
    .replace(/\bOrit\b/g,'Oh-reet')
    .replace(/\bGe'ez\b/gi,'Geh-ez')
    .replace(/\bDSS\b/g,'Dead Sea Scrolls')
    .replace(/\bBereshit\b/g,'Beh-reh-sheet')
    .replace(/\bShemot\b/g,'Sheh-mot')
    .replace(/\bDevarim\b/g,'Deh-vah-reem')
    .replace(/\bVayikra\b/g,'Vah-yik-rah')
    .replace(/\bBamidbar\b/g,'Bah-mid-bar')
    .replace(/\bYirmeyahu\b/g,'Yir-meh-yah-hoo')
    .replace(/\bYehezkel\b/g,'Yeh-hez-kel')
    .replace(/\bTehillim\b/g,'Teh-hil-leem')
    .replace(/\bMelakhim\b/g,'Meh-lah-kheem')
    .replace(/\bNekhemyah\b/g,'Neh-kheh-myah')
    .replace(/[\u05D0-\u05FF\uFB1D-\uFB4F]/g,'');// Hebrew script silent
}

function getReadableText(){
  const body=document.getElementById('chapterBody'); if(!body) return '';
  const mode=document.getElementById('readMode').value;
  let nodes=[];
  if(mode==='verses') nodes=Array.from(body.querySelectorAll('.para,.bullet-item'));
  else if(mode==='notes') nodes=Array.from(body.querySelectorAll('.note-box'));
  else nodes=Array.from(body.querySelectorAll('.para,.bullet-item,.note-label,.note-text,.fact-box'));
  return nodes.map(n=>(n.innerText||n.textContent||'').trim()).join(' . ');
}

function togglePlay(){if(reading&&!paused)pauseRead();else startRead();}
function startRead(){
  if(paused&&synth.paused){synth.resume();reading=true;paused=false;togglePlayUI(true,false);return;}
  stopRead();
  const raw=getReadableText(); if(!raw) return;
  const txt=pronunciationFix(raw);
  utterance=new SpeechSynthesisUtterance(txt);
  utterance.rate=parseFloat(document.getElementById('readSpeed').value);
  const vi=parseInt(document.getElementById('voiceSelect').value);
  if(voices[vi]) utterance.voice=voices[vi];
  utterance.onend=()=>{
    reading=false;paused=false;togglePlayUI(false,false);
    // Auto-continue
    const fi=chapterIndex.findIndex(x=>x.volNum===currentVol&&x.chIdx===currentChIdx);
    if(fi>=0&&fi<chapterIndex.length-1) setTimeout(()=>loadFlat(fi+1).then(()=>setTimeout(startRead,400)),200);
  };
  utterance.onerror=()=>{reading=false;paused=false;togglePlayUI(false,false);};
  synth.speak(utterance);
  reading=true;paused=false;togglePlayUI(true,false);
}
function pauseRead(){
  if(synth.speaking&&!synth.paused){synth.pause();reading=false;paused=true;togglePlayUI(false,true);}
}
function stopRead(){synth.cancel();reading=false;paused=false;togglePlayUI(false,false);}
function togglePlayUI(playing,pausing){
  document.getElementById('playBtn').style.display=(playing||pausing)?'none':'';
  document.getElementById('pauseBtn').style.display=playing?'':'none';
  if(pausing) document.getElementById('playBtn').style.display='';
}
function previewVoice(){
  synth.cancel();
  const u=new SpeechSynthesisUtterance('The Creator YHWH — Yahweh — established a covenant with the people.');
  u.rate=parseFloat(document.getElementById('readSpeed').value);
  const vi=parseInt(document.getElementById('voiceSelect').value);
  if(voices[vi]) u.voice=voices[vi];
  synth.speak(u);
}

// ── DISPLAY ──
function toggleReadingBar(){readingBarOpen=!readingBarOpen;document.getElementById('readingBar').classList.toggle('visible',readingBarOpen);}
function toggleReadingMode(){
  readingMode=!readingMode;
  document.getElementById('main').classList.toggle('reading-mode',readingMode);
  if(readingMode) closeSidebar();
}
function changeFontSize(d){fontAdj=Math.max(-4,Math.min(7,fontAdj+d));document.body.style.fontSize=(14+fontAdj)+'px';saveSettings();}
function changeLineSpacing(d){
  lineSpacing=Math.max(1.2,Math.min(2.8,lineSpacing+d));
  const b=document.getElementById('chapterBody');
  if(b) b.style.lineHeight=lineSpacing;
  saveSettings();
}

// ── MODALS ──
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');});});

// ── TOAST ──
let toastTimer;
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:7px 16px;border-radius:20px;font-size:.76rem;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity='0',2000);
}

// ── UTILS ──
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function onKey(e){
  if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='SELECT') return;
  if(e.key==='ArrowRight'||e.key==='j'){const n=document.querySelector('.ch-nav .nav-btn:last-child');if(n&&!n.disabled)n.click();}
  if(e.key==='ArrowLeft'||e.key==='k'){const p=document.querySelector('.ch-nav .nav-btn:first-child');if(p&&!p.disabled)p.click();}
  if(e.key==='Escape'){stopRead();closeSidebar();hideHLBar();document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));}
  if(e.key===' '&&!e.target.closest('button')){e.preventDefault();togglePlay();}
}
</script>
